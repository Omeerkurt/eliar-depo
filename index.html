<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eliar Depo & Hızlı Saha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
            darkbg: '#0B0F19', cardbg: '#161F30', bordercol: '#233047'
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    input, textarea, select { user-select: auto; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-darkbg text-slate-100 font-sans antialiased min-h-screen pb-16">

  <!-- ==================== HEADER ==================== -->
  <header class="sticky top-0 z-40 bg-cardbg/95 backdrop-blur border-b border-bordercol px-4 py-3 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-md shadow-brand-500/20">
        <i class="fa-solid fa-arrows-split-up-and-left text-white text-base"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-wide text-white leading-tight">ELIAR SAHA</h1>
        <p class="text-[10px] text-emerald-400 font-mono tracking-wider font-semibold">ÖMER ⇄ KAMİL HIZLI İLETİŞİM</p>
      </div>
    </div>

    <!-- Dil Değiştirici -->
    <div class="flex items-center bg-darkbg border border-bordercol rounded-xl p-1 shadow-inner">
      <button id="lang-tr" onclick="setLanguage('tr')" class="px-2.5 py-1 text-xs font-bold rounded-lg transition-all">TR</button>
      <button id="lang-uz" onclick="setLanguage('uz')" class="px-2.5 py-1 text-xs font-bold rounded-lg transition-all">UZ</button>
    </div>
  </header>

  <!-- ==================== ANA ALAN ==================== -->
  <main class="p-4 max-w-2xl mx-auto space-y-4">

    <!-- 2'Lİ ANA MENÜ (Stok & İş Akışı) -->
    <div class="grid grid-cols-2 gap-2 p-1 bg-cardbg border border-bordercol rounded-2xl text-xs font-semibold">
      <button onclick="switchTab('stock')" id="tab-btn-stock" class="tab-btn py-3 rounded-xl transition-all flex items-center justify-center space-x-2 bg-brand-600 text-white shadow-md">
        <i class="fa-solid fa-boxes-stacked text-sm"></i>
        <span data-i18n="nav_stock">Stok Yönetimi</span>
      </button>
      <button onclick="switchTab('workflow')" id="tab-btn-workflow" class="tab-btn py-3 rounded-xl transition-all flex items-center justify-center space-x-2 text-slate-400">
        <i class="fa-solid fa-repeat text-sm"></i>
        <span data-i18n="nav_workflow">Hızlı İş Akışı</span>
      </button>
    </div>

    <!-- ==================== 1. TAB: STOK ==================== -->
    <section id="tab-stock" class="tab-content space-y-3">
      <div class="flex space-x-2">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
          <input type="text" id="stock-search" oninput="renderStockTable()" placeholder="Parça veya kod ara..." 
            class="w-full bg-cardbg border border-bordercol rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-brand-500 text-white placeholder-slate-500">
        </div>
        <button onclick="openStockModal()" class="px-4 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold flex items-center space-x-1.5 text-xs shadow-md">
          <i class="fa-solid fa-plus"></i>
          <span data-i18n="btn_add_part">Yeni Parça</span>
        </button>
      </div>

      <div id="stock-list" class="space-y-2"></div>
    </section>

    <!-- ==================== 2. TAB: ÇİFT YÖNLÜ İŞ AKIŞI ==================== -->
    <section id="tab-workflow" class="tab-content hidden space-y-4">
      
      <!-- AKIŞ SEÇİCİ -->
      <div class="grid grid-cols-2 p-1 bg-darkbg border border-bordercol rounded-2xl gap-1">
        <button onclick="setWorkflowDirection('OMER_TO_KAMIL')" id="btn-flow-otk" 
          class="py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 bg-brand-600 text-white shadow-md">
          <i class="fa-solid fa-user-gear"></i>
          <span>Ömer ➔ Kamil</span>
        </button>
        <button onclick="setWorkflowDirection('KAMIL_TO_OMER')" id="btn-flow-kto" 
          class="py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 text-slate-400 hover:text-white">
          <i class="fa-solid fa-clipboard-check"></i>
          <span>Kamil ➔ Ömer</span>
        </button>
      </div>

      <!-- AKIŞ 1: ÖMER'DEN KAMİL'E (Saha Parça / Teklif Onayı) -->
      <div id="form-omer-to-kamil" class="bg-cardbg border border-bordercol rounded-2xl p-4 shadow-xl space-y-3">
        <div class="border-b border-bordercol pb-2">
          <h2 class="text-sm font-bold text-white flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
            <span data-i18n="title_otk">Sahadan Talep (Ömer ➔ Kamil)</span>
          </h2>
          <p class="text-[11px] text-slate-400 mt-0.5" data-i18n="desc_otk">Parça talebi Kamil'e interaktif butonlu bildirim olarak düşer.</p>
        </div>

        <!-- ELLE GİRİLEN MÜŞTERİ BİLGİLERİ -->
        <div class="space-y-2">
          <div>
            <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_firm_name">Müşteri / Fabrika Adı</label>
            <input type="text" id="otk-firm-name" placeholder="Örn: Taşkent İplik Fabrikası" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_firm_contact">Yetkili Kişi & Telefon</label>
            <input type="text" id="otk-firm-contact" placeholder="Örn: Bekzod Usta (+998 90 123 45 67)" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <div>
          <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_select_part">İstenen Donanım / Parça (Stoktan)</label>
          <select id="otk-part" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none"></select>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_quantity">Miktar</label>
            <input type="number" id="otk-qty" value="1" min="1" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
          </div>
          <div>
            <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_priority">Durum</label>
            <select id="otk-priority" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
              <option value="NORMAL" data-i18n="prio_normal">Normal Servis</option>
              <option value="KRITIK" class="text-rose-400" data-i18n="prio_critical">Acil (Hat Duruşu!)</option>
            </select>
          </div>
        </div>
        <div>
          <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_note_otk">Ömer'in Teknik Notu</label>
          <textarea id="otk-notes" rows="2" placeholder="Örn: 2 no'lu panodaki ana CPU yandı, acil değişim gerekli..." class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white placeholder-slate-600"></textarea>
        </div>
        <button onclick="dispatchOmerToKamil()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold flex items-center justify-center space-x-2 text-sm shadow-lg shadow-emerald-900/30">
          <i class="fa-brands fa-telegram text-base"></i>
          <span data-i18n="btn_send_kamil">Kamil'e Gönder & Onay İste</span>
        </button>
      </div>

      <!-- AKIŞ 2: KAMİL'DEN ÖMER'E (Saha İş Emri / Görev Atama) -->
      <div id="form-kamil-to-omer" class="bg-cardbg border border-bordercol rounded-2xl p-4 shadow-xl space-y-3 hidden">
        <div class="border-b border-bordercol pb-2">
          <h2 class="text-sm font-bold text-white flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
            <span data-i18n="title_kto">Sahaya Görev & İş Emri (Kamil ➔ Ömer)</span>
          </h2>
          <p class="text-[11px] text-slate-400 mt-0.5" data-i18n="desc_kto">Ömer'in telefonuna bildirim gider, tek tıkla canlı telemetri döner.</p>
        </div>

        <!-- ELLE GİRİLEN HEDEF MÜŞTERİ BİLGİLERİ -->
        <div class="space-y-2">
          <div>
            <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_firm_name">Gidilecek Müşteri / Tesis Adı</label>
            <input type="text" id="kto-firm-name" placeholder="Örn: Samarkand Tekstil Boyahane" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
          </div>
          <div>
            <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_firm_contact">Tesis Sorumlusu & Telefon</label>
            <input type="text" id="kto-firm-contact" placeholder="Örn: Farhod Bey (+998 93 450 11 22)" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
          </div>
        </div>

        <div>
          <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_task_type">Görev Tipi</label>
          <select id="kto-task-type" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
            <option value="ACIL_ARIZA">Acil Arıza Müdahalesi</option>
            <option value="DONANIM_MONTAJ">Yeni Donanım Montajı</option>
            <option value="PERIYODIK_BAKIM">Periyodik PLC Bakımı</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_dispatch_part">Yanına Alması Gereken Donanım</label>
          <select id="kto-part" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none"></select>
        </div>
        <div>
          <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_instructions">Kamil'in Talimatı</label>
          <textarea id="kto-instructions" rows="2" placeholder="Örn: İnverter parametrelerini kontrol et, gerekirse sürücüyü değiştir..." class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white placeholder-slate-600"></textarea>
        </div>
        <button onclick="dispatchKamilToOmer()" class="w-full bg-cyan-600 hover:bg-cyan-500 py-3 rounded-xl font-bold flex items-center justify-center space-x-2 text-sm shadow-lg shadow-cyan-900/30">
          <i class="fa-solid fa-paper-plane text-base"></i>
          <span data-i18n="btn_send_omer">Ömer'e Sahaya İş Emri Fırlat</span>
        </button>
      </div>

    </section>

  </main>

  <!-- ==================== MODAL: YENİ PARÇA EKLE ==================== -->
  <div id="modal-stock" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-cardbg border border-bordercol w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-3">
      <div class="flex justify-between items-center border-b border-bordercol pb-2">
        <h3 class="font-bold text-white text-sm" data-i18n="modal_add_title">Yeni Endüstriyel Parça</h3>
        <button onclick="closeStockModal()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white rounded-lg bg-darkbg">✕</button>
      </div>
      <div>
        <label class="text-xs text-slate-400 font-medium">Parça Kodu</label>
        <input type="text" id="m-code" placeholder="Örn: EL-PLC-T390" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
      </div>
      <div>
        <label class="text-xs text-slate-400 font-medium">Parça İsmi</label>
        <input type="text" id="m-name" placeholder="Örn: Eliar Boya Kontrolörü" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
      </div>
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="text-xs text-slate-400 font-medium">Miktar</label>
          <input type="number" id="m-qty" value="1" min="0" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium">Fiyat</label>
          <input type="number" id="m-price" value="100" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium">Birim</label>
          <select id="m-curr" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-2 py-2 text-sm text-white">
            <option value="USD">USD</option>
            <option value="UZS">UZS</option>
            <option value="TRY">TRY</option>
          </select>
        </div>
      </div>
      <div>
        <label class="text-xs text-slate-400 font-medium">Araç İçi Raf / Konum</label>
        <input type="text" id="m-loc" placeholder="Örn: ÖMER-ARAÇ-RAF1" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
      </div>
      <button onclick="saveStockItem()" class="w-full bg-brand-600 hover:bg-brand-500 py-2.5 rounded-xl font-bold text-white text-sm" data-i18n="btn_save_item">Stoka Kaydet & Bildir</button>
    </div>
  </div>

  <!-- ==================== UYGULAMA MOTORU ==================== -->
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
      tg.setHeaderColor('#161F30');
      tg.setBackgroundColor('#0B0F19');
    }

    const I18N = {
      tr: {
        nav_stock: "Stok Yönetimi", nav_workflow: "Hızlı İş Akışı",
        title_otk: "Sahadan Talep (Ömer ➔ Kamil)",
        desc_otk: "Parça talebi Kamil'e interaktif butonlu bildirim olarak düşer.",
        title_kto: "Sahaya Görev & İş Emri (Kamil ➔ Ömer)",
        desc_kto: "Ömer'in telefonuna bildirim gider, tek tıkla canlı telemetri döner.",
        lbl_firm_name: "Müşteri / Fabrika Adı",
        lbl_firm_contact: "Yetkili Kişi & Telefon",
        lbl_select_part: "İstenen Donanım / Parça",
        lbl_quantity: "Miktar",
        lbl_priority: "Öncelik Seviyesi",
        prio_normal: "Normal Servis",
        prio_critical: "Acil (Hat Duruşu!)",
        lbl_note_otk: "Ömer'in Teknik Notu",
        btn_send_kamil: "Kamil'e Gönder & Onay İste",
        lbl_task_type: "Görev Tipi",
        lbl_dispatch_part: "Yanına Alması Gereken Donanım",
        lbl_instructions: "Kamil'in Talimatı",
        btn_send_omer: "Ömer'e Sahaya İş Emri Fırlat",
        btn_add_part: "Yeni Parça",
        modal_add_title: "Yeni Endüstriyel Parça",
        btn_save_item: "Stoka Kaydet & Bildir",
        shelf: "Konum", stock_status: "Mevcut:"
      },
      uz: {
        nav_stock: "Ombor Boshqaruvi", nav_workflow: "Tezkor Ish Oqimi",
        title_otk: "Maydondan So'rov (O'mar ➔ Komil)",
        desc_otk: "Qism so'rovi Komilga tasdiq tugmasi bilan boradi.",
        title_kto: "Ish Buyrug'i (Komil ➔ O'mar)",
        desc_kto: "O'marning telefoniga boradi, bir bosishda javob qaytadi.",
        lbl_firm_name: "Mijoz / Fabrika Nomi",
        lbl_firm_contact: "Mas'ul Shaxs & Telefon",
        lbl_select_part: "Kerakli Qurilma / Qism",
        lbl_quantity: "Miqdori",
        lbl_priority: "Muhimlik Darajasi",
        prio_normal: "Oddiy Servis",
        prio_critical: "Shoshilinch (Zavod To'xtadi!)",
        lbl_note_otk: "O'marning Izohi",
        btn_send_kamil: "Komilga Yuborish & Tasdiq Olish",
        lbl_task_type: "Vazifa Turi",
        lbl_dispatch_part: "Olinishi Kerak Bo'lgan Qism",
        lbl_instructions: "Komilning Ko'rsatmasi",
        btn_send_omer: "O'marga Ish Buyrug'ini Yuborish",
        btn_add_part: "Yangi Qism",
        modal_add_title: "Yangi Sanoat Qismi",
        btn_save_item: "Omborga Saqlash & Xabar Qilish",
        shelf: "Joy", stock_status: "Mavjud:"
      }
    };

    let currentLang = localStorage.getItem('eliar_lang') || 'tr';
    let currentFlow = 'OMER_TO_KAMIL';

    const DEFAULT_STOCKS = [
      { id: "1", code: "EL-PLC-T390", name: "Eliar T390 Boya Kontrolörü", qty: 6, price: 1250, curr: "USD", loc: "ÖMER-ARAÇ-RAF1" },
      { id: "2", code: "IO-MOD-16DI", name: "16 Kanal Giriş Kartı", qty: 18, price: 180, curr: "USD", loc: "ÖMER-ARAÇ-RAF2" },
      { id: "3", code: "EL-VLV-3W", name: "Buhar Vanası DN25", qty: 3, price: 5400000, curr: "UZS", loc: "MERKEZ-DEPO" }
    ];

    let stocks = JSON.parse(localStorage.getItem('eliar_stocks')) || DEFAULT_STOCKS;

    function persist() {
      localStorage.setItem('eliar_stocks', JSON.stringify(stocks));
      populateSelects();
    }

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('eliar_lang', lang);
      document.getElementById('lang-tr').className = lang === 'tr' ? "px-2.5 py-1 text-xs font-bold rounded-lg bg-brand-600 text-white" : "px-2.5 py-1 text-xs font-bold rounded-lg text-slate-400";
      document.getElementById('lang-uz').className = lang === 'uz' ? "px-2.5 py-1 text-xs font-bold rounded-lg bg-brand-600 text-white" : "px-2.5 py-1 text-xs font-bold rounded-lg text-slate-400";
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (I18N[lang][k]) el.innerText = I18N[lang][k];
      });
      renderStockTable();
    }

    function switchTab(t) {
      document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden'));
      document.getElementById('tab-' + t).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('bg-brand-600', 'text-white'); b.classList.add('text-slate-400'); });
      document.getElementById('tab-btn-' + t).classList.add('bg-brand-600', 'text-white');
      if (t === 'workflow') populateSelects();
    }

    function setWorkflowDirection(dir) {
      currentFlow = dir;
      if (dir === 'OMER_TO_KAMIL') {
        document.getElementById('btn-flow-otk').className = "py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 bg-brand-600 text-white shadow-md";
        document.getElementById('btn-flow-kto').className = "py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 text-slate-400 hover:text-white";
        document.getElementById('form-omer-to-kamil').classList.remove('hidden');
        document.getElementById('form-kamil-to-omer').classList.add('hidden');
      } else {
        document.getElementById('btn-flow-kto').className = "py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 bg-cyan-600 text-white shadow-md";
        document.getElementById('btn-flow-otk').className = "py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 text-slate-400 hover:text-white";
        document.getElementById('form-kamil-to-omer').classList.remove('hidden');
        document.getElementById('form-omer-to-kamil').classList.add('hidden');
      }
    }

    function renderStockTable() {
      const s = document.getElementById('stock-search')?.value.toLowerCase() || "";
      document.getElementById('stock-list').innerHTML = stocks.filter(p => p.name.toLowerCase().includes(s) || p.code.toLowerCase().includes(s)).map(i => `
        <div class="bg-cardbg border border-bordercol rounded-2xl p-3 flex justify-between items-center shadow-md">
          <div>
            <span class="text-[10px] font-mono font-bold text-emerald-400">${i.code}</span>
            <h4 class="text-sm font-semibold text-white leading-tight">${i.name}</h4>
            <p class="text-xs text-slate-400 mt-0.5">${I18N[currentLang].shelf}: ${i.loc} • <span class="text-amber-400 font-bold">${i.price} ${i.curr}</span></p>
          </div>
          <div class="flex items-center space-x-2">
            <span class="text-sm font-black text-emerald-400">${i.qty} ADT</span>
            <div class="flex flex-col space-y-1">
              <button onclick="changeStock('${i.id}', 1)" title="1 Adet Ekle ve Bildir" class="w-7 h-7 bg-darkbg border border-bordercol hover:bg-emerald-950 text-emerald-400 rounded-lg text-xs font-bold flex items-center justify-center active:scale-95">+</button>
              <button onclick="changeStock('${i.id}', -1)" title="1 Adet Düş ve Bildir" class="w-7 h-7 bg-darkbg border border-bordercol hover:bg-rose-950 text-rose-400 rounded-lg text-xs font-bold flex items-center justify-center active:scale-95">-</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function changeStock(id, delta) {
      const it = stocks.find(x => x.id === id);
      if (!it) return;
      if (it.qty + delta < 0) {
        alert("Stok adedi 0'ın altına düşemez!");
        return;
      }

      const actionText = delta < 0 ? "1 ADET KULLANILDI / DÜŞÜLDÜ" : "1 ADET EKLENDİ";
      const confirmMsg = `${it.code} (${it.name})\nİşlem: ${actionText}\n\nBu işlem Ömer ve Kamil'e Telegram'dan anlık olarak bildirilsin mi?`;
      
      if (!confirm(confirmMsg)) return;

      it.qty += delta;
      persist();
      renderStockTable();

      const payload = {
        direction: "STOCK_CHANGE",
        action: delta < 0 ? "DECREASE" : "INCREASE",
        delta: Math.abs(delta),
        code: it.code,
        name: it.name,
        current_qty: it.qty,
        loc: it.loc
      };

      if (tg?.sendData) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert(`[Test Modu] ${it.code} güncellendi: ${it.qty} Adet. Telegram'da Ömer ve Kamil'e mesaj atıldı.`);
      }
    }

    function populateSelects() {
      const partOptions = stocks.map(p => `<option value="${p.code}">${p.code} - ${p.name} (${p.qty} Adet)</option>`).join('');
      document.getElementById('otk-part').innerHTML = partOptions;
      document.getElementById('kto-part').innerHTML = `<option value="YOK">Donanım Gerekmiyor</option>` + partOptions;
    }

    function openStockModal() { document.getElementById('modal-stock').classList.remove('hidden'); document.getElementById('modal-stock').classList.add('flex'); }
    function closeStockModal() { document.getElementById('modal-stock').classList.add('hidden'); document.getElementById('modal-stock').classList.remove('flex'); }

    function saveStockItem() {
      const code = document.getElementById('m-code').value.trim();
      const name = document.getElementById('m-name').value.trim();
      const qty = parseInt(document.getElementById('m-qty').value) || 0;
      const price = parseFloat(document.getElementById('m-price').value) || 0;
      const curr = document.getElementById('m-curr').value;
      const loc = document.getElementById('m-loc').value.trim() || 'ÖMER-ARAÇ';
      
      if (!code || !name) { alert("Kod ve isim zorunludur."); return; }
      
      stocks.unshift({ id: Date.now().toString(), code, name, qty, price, curr, loc });
      persist();
      closeStockModal();
      renderStockTable();

      const payload = {
        direction: "STOCK_CHANGE",
        action: "NEW_ITEM",
        code: code,
        name: name,
        qty: qty,
        price: price,
        curr: curr,
        loc: loc
      };

      if (tg?.sendData) tg.sendData(JSON.stringify(payload));
    }

    /* ELLE GİRİLEN MÜŞTERİ VERİSİ İLE ÖMER ➔ KAMİL */
    function dispatchOmerToKamil() {
      const firmName = document.getElementById('otk-firm-name').value.trim();
      const firmContact = document.getElementById('otk-firm-contact').value.trim();

      if (!firmName) {
        alert("Lütfen Müşteri / Fabrika Adını yazın!");
        return;
      }

      const payload = {
        direction: "OMER_TO_KAMIL",
        firm: firmName,
        contact: firmContact || "Belirtilmedi",
        part_code: document.getElementById('otk-part').value,
        quantity: document.getElementById('otk-qty').value,
        priority: document.getElementById('otk-priority').value,
        notes: document.getElementById('otk-notes').value
      };

      if (tg?.sendData) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert(`[Test Modu] ${firmName} için talep Kamil'e iletildi.`);
      }
    }

    /* ELLE GİRİLEN MÜŞTERİ VERİSİ İLE KAMİL ➔ ÖMER */
    function dispatchKamilToOmer() {
      const firmName = document.getElementById('kto-firm-name').value.trim();
      const firmContact = document.getElementById('kto-firm-contact').value.trim();

      if (!firmName) {
        alert("Lütfen Gidilecek Müşteri / Tesis Adını yazın!");
        return;
      }

      const payload = {
        direction: "KAMIL_TO_OMER",
        firm: firmName,
        contact: firmContact || "Belirtilmedi",
        task_type: document.getElementById('kto-task-type').value,
        dispatch_part: document.getElementById('kto-part').value,
        instructions: document.getElementById('kto-instructions').value
      };

      if (tg?.sendData) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert(`[Test Modu] ${firmName} iş emri Ömer'e iletildi.`);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setLanguage(currentLang);
      switchTab('stock');
      populateSelects();
    });
  </script>
</body>
</html>
