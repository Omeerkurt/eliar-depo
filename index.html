<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Elips Depo & Ekran Servis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { 500: '#22c55e', 600: '#16a34a' }, darkbg: '#0B0F19', cardbg: '#161F30', bordercol: '#233047' } } }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    input, textarea, select { -webkit-user-select: text !important; user-select: text !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-darkbg text-slate-100 font-sans antialiased min-h-screen pb-16">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 bg-cardbg/95 backdrop-blur border-b border-bordercol px-4 py-3 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-emerald-700 flex items-center justify-center shadow-md">
        <i class="fa-solid fa-boxes-stacked text-white text-base"></i>
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="text-base font-bold tracking-wide text-white leading-tight">ELİPS DEPO</h1>
          <span id="connection-status" class="text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">🟢 Çevrimiçi</span>
        </div>
        <p class="text-[10px] text-emerald-400 font-mono tracking-wider font-semibold">ÖZBEKİSTAN MERKEZ SERVİS</p>
      </div>
    </div>
    <button onclick="window.location.reload()" title="Yenile" class="px-2.5 py-1.5 bg-darkbg border border-bordercol rounded-xl text-slate-400 hover:text-white text-xs flex items-center space-x-1">
      <i class="fa-solid fa-arrows-rotate"></i>
    </button>
  </header>

  <!-- 3'LÜ MENÜ (Depo Stok | Ekran Tamir | Rapor) -->
  <main class="p-3.5 max-w-2xl mx-auto space-y-4">
    <div class="grid grid-cols-3 gap-1.5 p-1 bg-cardbg border border-bordercol rounded-2xl text-xs font-semibold">
      <button onclick="switchTab('stock')" id="tab-btn-stock" class="tab-btn py-3 rounded-xl flex flex-col items-center justify-center space-y-1 bg-brand-600 text-white shadow-md">
        <i class="fa-solid fa-boxes-stacked text-sm"></i>
        <span>Depo Stok</span>
      </button>
      <button onclick="switchTab('repair')" id="tab-btn-repair" class="tab-btn py-3 rounded-xl flex flex-col items-center justify-center space-y-1 text-slate-400">
        <i class="fa-solid fa-tv text-sm text-cyan-400"></i>
        <span>Ekran Tamir (<span id="count-repair-active">0</span>)</span>
      </button>
      <button onclick="switchTab('reports')" id="tab-btn-reports" class="tab-btn py-3 rounded-xl flex flex-col items-center justify-center space-y-1 text-slate-400">
        <i class="fa-solid fa-chart-line text-sm"></i>
        <span>Rapor & Tesis</span>
      </button>
    </div>

    <!-- 1. TAB: DEPO STOK LİSTESİ -->
    <section id="tab-stock" class="tab-content space-y-3">
      <div class="flex space-x-2">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
          <input type="text" id="stock-search" oninput="renderStockTable()" placeholder="Kod veya isimle ara..." 
            class="w-full bg-cardbg border border-bordercol rounded-xl pl-9 pr-3 py-2 text-xs text-white focus:outline-none">
        </div>
        <button onclick="openStockModal()" class="px-3.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold flex items-center space-x-1 text-xs shadow-md">
          <i class="fa-solid fa-plus"></i>
          <span>Yeni</span>
        </button>
      </div>

      <div class="flex space-x-1.5 overflow-x-auto no-scrollbar py-0.5 text-xs">
        <button onclick="filterCategory('ALL')" id="pill-ALL" class="cat-pill px-3 py-1.5 rounded-xl font-bold bg-brand-600 text-white whitespace-nowrap">Tümü (<span id="count-all">0</span>)</button>
        <button onclick="filterCategory('YENI')" id="pill-YENI" class="cat-pill px-3 py-1.5 rounded-xl font-semibold bg-cardbg border border-bordercol text-amber-300 whitespace-nowrap">✨ Yeni (<span id="count-yeni">0</span>)</button>
        <button onclick="filterCategory('KONTROL')" id="pill-KONTROL" class="cat-pill px-3 py-1.5 rounded-xl font-semibold bg-cardbg border border-bordercol text-slate-300 whitespace-nowrap">Kontrolör (<span id="count-kontrol">0</span>)</button>
        <button onclick="filterCategory('ELEKTRONIK')" id="pill-ELEKTRONIK" class="cat-pill px-3 py-1.5 rounded-xl font-semibold bg-cardbg border border-bordercol text-slate-300 whitespace-nowrap">Elektronik (<span id="count-elektronik">0</span>)</button>
        <button onclick="filterCategory('MEKATRONIK')" id="pill-MEKATRONIK" class="cat-pill px-3 py-1.5 rounded-xl font-semibold bg-cardbg border border-bordercol text-slate-300 whitespace-nowrap">Mekatronik (<span id="count-mekatronik">0</span>)</button>
      </div>

      <div id="stock-list" class="space-y-2"></div>
    </section>

    <!-- 2. TAB: EKRAN TAMİR & SERVİS MODÜLÜ -->
    <section id="tab-repair" class="tab-content hidden space-y-3">
      <div class="flex justify-between items-center bg-cardbg border border-bordercol rounded-2xl p-3 shadow-md">
        <div>
          <h3 class="text-xs font-bold text-white flex items-center space-x-1.5">
            <i class="fa-solid fa-microchip text-cyan-400"></i>
            <span>Ekran & Cihaz Tamir Takibi</span>
          </h3>
          <p class="text-[10px] text-slate-400 mt-0.5">Özbekistan / Türkiye Servis Süreçleri</p>
        </div>
        <button onclick="openRepairModal()" class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl text-xs font-bold flex items-center space-x-1 shadow">
          <i class="fa-solid fa-plus"></i>
          <span>Ekran Kaydı</span>
        </button>
      </div>

      <div class="flex space-x-1.5 overflow-x-auto no-scrollbar py-0.5 text-xs">
        <button onclick="filterRepairs('ALL')" id="rf-ALL" class="rf-pill px-2.5 py-1 rounded-xl font-bold bg-cyan-600 text-white whitespace-nowrap">Tümü (<span id="rc-all">0</span>)</button>
        <button onclick="filterRepairs('BEKLEMEDE')" id="rf-BEKLEMEDE" class="rf-pill px-2.5 py-1 rounded-xl font-semibold bg-cardbg border border-bordercol text-amber-300 whitespace-nowrap">⏳ Bekleyen (<span id="rc-wait">0</span>)</button>
        <button onclick="filterRepairs('OZBEKISTAN')" id="rf-OZBEKISTAN" class="rf-pill px-2.5 py-1 rounded-xl font-semibold bg-cardbg border border-bordercol text-emerald-400 whitespace-nowrap">🇺🇿 Özbekistan (<span id="rc-uz">0</span>)</button>
        <button onclick="filterRepairs('TURKIYE')" id="rf-TURKIYE" class="rf-pill px-2.5 py-1 rounded-xl font-semibold bg-cardbg border border-bordercol text-rose-400 whitespace-nowrap">🇹🇷 Türkiye'de (<span id="rc-tr">0</span>)</button>
      </div>

      <div id="repair-list" class="space-y-2.5"></div>
    </section>

    <!-- 3. TAB: RAPOR & TESİS GEÇMİŞİ -->
    <section id="tab-reports" class="tab-content hidden space-y-3">
      <div class="bg-cardbg border border-bordercol rounded-2xl p-4 space-y-3 shadow-xl">
        <div class="flex justify-between items-center border-b border-bordercol pb-2">
          <h3 class="text-xs font-bold text-white flex items-center space-x-1.5">
            <i class="fa-solid fa-chart-pie text-emerald-400"></i>
            <span>Satış Z-Raporu</span>
          </h3>
          <button onclick="exportZReportCSV()" class="px-2.5 py-1 bg-emerald-600 text-white rounded-xl text-[11px] font-bold">Excel İndir</button>
        </div>
        <div class="grid grid-cols-2 gap-2 text-center">
          <div class="p-2 bg-darkbg rounded-xl"><span class="text-[10px] text-slate-400 block">Toplam Parça</span><span id="z-total-qty" class="text-base font-black text-emerald-400">0 ADT</span></div>
          <div class="p-2 bg-darkbg rounded-xl"><span class="text-[10px] text-slate-400 block">Hizmet Verilen</span><span id="z-total-plants" class="text-base font-black text-cyan-400">0 Tesis</span></div>
        </div>
        <div class="space-y-1.5 max-h-56 overflow-y-auto no-scrollbar" id="z-sales-list"></div>
      </div>

      <div class="bg-cardbg border border-bordercol rounded-2xl p-4 space-y-2 shadow-xl">
        <h3 class="text-xs font-bold text-white">🏭 Tesis Parça Geçmişi</h3>
        <input type="text" id="facility-search-input" oninput="queryFacilityHistoryLive()" placeholder="Fabrika Adı Yazın (TERRY JAR)..." class="w-full bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-xs text-white">
        <div id="facility-history-results" class="space-y-1.5 max-h-48 overflow-y-auto text-xs"></div>
      </div>
    </section>
  </main>

  <!-- MODAL: YENİ EKRAN TAMİR KAYDI -->
  <div id="modal-repair" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-cardbg border border-bordercol w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-3">
      <div class="flex justify-between items-center border-b border-bordercol pb-2">
        <h3 class="font-bold text-white text-sm">Yeni Ekran / Cihaz Servis Kaydı</h3>
        <button onclick="closeRepairModal()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white rounded-lg bg-darkbg">✕</button>
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="text-slate-400 font-medium">Müşteri / Fabrika <span class="text-rose-400">*</span></label>
          <input type="text" id="r-firm" placeholder="Örn: TERRY JAR" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-white">
        </div>
        <div>
          <label class="text-slate-400 font-medium">Model <span class="text-rose-400">*</span></label>
          <input type="text" id="r-model" placeholder="Örn: Pd320, T7700" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-white">
        </div>
      </div>
      <div class="text-xs">
        <label class="text-slate-400 font-medium">Ekran Seri No</label>
        <input type="text" id="r-sn" placeholder="Örn: SN-92841" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-white font-mono">
      </div>
      <div class="text-xs">
        <label class="text-slate-400 font-medium">Arıza / Sıkıntı <span class="text-rose-400">*</span></label>
        <input type="text" id="r-issue" placeholder="Örn: Dokunmatik basmıyor, besleme kartı yandı" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-white">
      </div>
      <div class="text-xs">
        <label class="text-slate-400 font-medium">Servis Durumu</label>
        <select id="r-status" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-2 py-2 text-white font-bold">
          <option value="BEKLEMEDE">⏳ İncelemede / Depoda Bekliyor</option>
          <option value="OZBEKISTAN">🇺🇿 Özbekistan'da Onarıldı</option>
          <option value="TURKIYE">🇹🇷 Türkiye'ye Onarıma Gönderildi</option>
        </select>
      </div>
      <div class="text-xs">
        <label class="text-slate-400 font-medium">Notlar</label>
        <input type="text" id="r-notes" placeholder="Varsa kargo veya teslimat notu..." class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-white">
      </div>
      <button onclick="saveRepairRecord()" class="w-full bg-cyan-600 hover:bg-cyan-500 py-2.5 rounded-xl font-bold text-white text-xs shadow-lg">Servis Kaydını Kaydet</button>
    </div>
  </div>

  <!-- MODAL: ÜRÜN DÜZENLEME -->
  <div id="modal-edit-part" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-cardbg border border-bordercol w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-3">
      <div class="flex justify-between items-center border-b border-bordercol pb-2">
        <h3 class="font-bold text-white text-sm">Ürünü Düzenle</h3>
        <button onclick="closeEditPartModal()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white rounded-lg bg-darkbg">✕</button>
      </div>
      <input type="hidden" id="edit-id">
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="text-slate-400 font-semibold">Kod</label>
          <input type="text" id="edit-code" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-white font-mono">
        </div>
        <div>
          <label class="text-slate-400 font-semibold">Kategori</label>
          <select id="edit-cat" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-2 py-2 text-white font-bold">
            <option value="MEKATRONIK">Mekatronik</option>
            <option value="ELEKTRONIK">Elektronik</option>
            <option value="KONTROL">Kontrolör</option>
          </select>
        </div>
      </div>
      <div class="text-xs">
        <label class="text-slate-400 font-semibold">Ad</label>
        <input type="text" id="edit-name" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-white">
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="text-slate-400 font-semibold">Stok Adedi</label>
          <input type="number" id="edit-qty" min="0" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-emerald-400 font-bold">
        </div>
        <div>
          <label class="text-slate-400 font-semibold">Konum</label>
          <input type="text" id="edit-loc" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-white">
        </div>
      </div>
      <div class="flex items-center space-x-2 bg-darkbg p-2 rounded-xl border border-bordercol text-xs">
        <input type="checkbox" id="edit-is-new" class="w-4 h-4 accent-amber-500 rounded">
        <label for="edit-is-new" class="text-slate-300 font-semibold">✨ Bu parçada [YENİ] rozeti göster</label>
      </div>
      <button onclick="savePartChanges()" class="w-full bg-brand-600 hover:bg-brand-500 py-2.5 rounded-xl font-bold text-white text-xs shadow-lg">Değişiklikleri Kaydet</button>
      <div class="pt-2 border-t border-bordercol/40 flex space-x-2">
        <button onclick="deletePartFromModal(true)" class="flex-1 bg-slate-800 border border-slate-600 text-slate-300 py-2 rounded-xl font-bold text-[11px]">🔕 Bildirimsiz Sil</button>
        <button onclick="deletePartFromModal(false)" class="flex-1 bg-rose-950 border border-rose-800 text-rose-300 py-2 rounded-xl font-bold text-[11px]">📢 Bildirerek Sil</button>
      </div>
    </div>
  </div>

  <!-- MODAL: HIZLI STOK ÇIKIŞI -->
  <div id="modal-deduct" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-cardbg border border-bordercol w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-3">
      <div class="flex justify-between items-center border-b border-bordercol pb-2">
        <div><h3 class="font-bold text-white text-sm">Stok Çıkışı / Satış</h3><p id="deduct-part-header" class="text-[11px] text-emerald-400 font-mono mt-0.5"></p></div>
        <button onclick="closeDeductModal()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white rounded-lg bg-darkbg">✕</button>
      </div>
      <div>
        <label class="text-xs text-slate-400 font-semibold">Firma İsmi <span class="text-rose-400">*</span></label>
        <input type="text" id="deduct-destination" placeholder="Örn: TERRY JAR" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-xs text-white">
      </div>
      <div>
        <label class="text-xs text-slate-400 font-semibold">Düşülecek Miktar <span class="text-rose-400">*</span></label>
        <input type="number" id="deduct-qty" value="1" min="1" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-white font-bold text-sm">
      </div>
      <input type="hidden" id="deduct-part-id" value="">
      <button onclick="confirmStockDeduction()" class="w-full bg-rose-600 hover:bg-rose-500 py-2.5 rounded-xl font-bold text-white text-xs">Stoktan Düş & Bildir</button>
    </div>
  </div>

  <!-- MODAL: YENİ PARÇA -->
  <div id="modal-stock" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-cardbg border border-bordercol w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-3">
      <div class="flex justify-between items-center border-b border-bordercol pb-2">
        <h3 class="font-bold text-white text-sm">Yeni Parça Tanımla</h3>
        <button onclick="closeStockModal()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white rounded-lg bg-darkbg">✕</button>
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="text-slate-400 font-medium">Ürün Kodu <span class="text-rose-400">*</span></label>
          <input type="text" id="m-code" placeholder="Örn: 90880" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-white font-mono">
        </div>
        <div>
          <label class="text-slate-400 font-medium">Kategori <span class="text-rose-400">*</span></label>
          <select id="m-cat" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-2 py-2 text-white">
            <option value="MEKATRONIK">Mekatronik</option>
            <option value="ELEKTRONIK">Elektronik</option>
            <option value="KONTROL">Kontrolör</option>
          </select>
        </div>
      </div>
      <div class="text-xs">
        <label class="text-slate-400 font-medium">Ürün Adı <span class="text-rose-400">*</span></label>
        <input type="text" id="m-name" placeholder="Örn: DST Çekvalf Teflonu" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-white">
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="text-slate-400 font-medium">Başlangıç Adedi</label>
          <input type="number" id="m-qty" value="0" min="0" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-white">
        </div>
        <div>
          <label class="text-slate-400 font-medium">Konum</label>
          <input type="text" id="m-loc" value="ELIPS-DEPO" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-white">
        </div>
      </div>
      <div class="flex items-center space-x-2 bg-darkbg p-2 rounded-xl border border-bordercol text-xs">
        <input type="checkbox" id="m-is-new" checked class="w-4 h-4 accent-amber-500 rounded">
        <label for="m-is-new" class="text-slate-300 font-semibold">✨ Bu parçaya [YENİ] logosu ekle</label>
      </div>
      <button onclick="saveStockItem()" class="w-full bg-brand-600 hover:bg-brand-500 py-2.5 rounded-xl font-bold text-white text-xs shadow-lg">Kaydet & Ekle</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand(); tg.ready();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      tg.setHeaderColor('#161F30'); tg.setBackgroundColor('#0B0F19');
    }

    function updateOnlineStatus() {
      const badge = document.getElementById('connection-status');
      if (!badge) return;
      if (navigator.onLine) {
        badge.className = "text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40";
        badge.innerHTML = "🟢 Çevrimiçi";
      } else {
        badge.className = "text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40";
        badge.innerHTML = "📴 Çevrimdışı (Hafızadan)";
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    // TÜM GERÇEK PARÇA LİSTESİ (TAMAMI GERİ YÜKLENDİ)
    const REAL_STOCKS_DATA = [
      {id:"s1",code:"Pd320",name:"Pd320 Kontrol Cihazı",cat:"KONTROL",qty:4,loc:"ELIPS-DEPO"},
      {id:"s2",code:"PD330",name:"PD330 Kontrol Cihazı",cat:"KONTROL",qty:4,loc:"ELIPS-DEPO"},
      {id:"s3",code:"Aim8-A",name:"Aim8-A Analog Giriş Modülü",cat:"ELEKTRONIK",qty:0,loc:"ELIPS-DEPO"},
      {id:"s4",code:"Aim8-B",name:"Aim8-B Analog Giriş Modülü",cat:"ELEKTRONIK",qty:5,loc:"ELIPS-DEPO"},
      {id:"s5",code:"Dim32",name:"Dim32 Dijital Giriş Modülü",cat:"ELEKTRONIK",qty:4,loc:"ELIPS-DEPO"},
      {id:"s6",code:"Dom16-PLC",name:"Dom16-PLC Çıkış Modülü",cat:"ELEKTRONIK",qty:6,loc:"ELIPS-DEPO"},
      {id:"s7",code:"P44",name:"P44 Panel Kartı",cat:"ELEKTRONIK",qty:3,loc:"ELIPS-DEPO"},

    const STORAGE_KEY = 'elips_depo_v11';
    let stocks = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!stocks || stocks.length < 50) {
      stocks = REAL_STOCKS_DATA;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stocks));
    }

    let sales = JSON.parse(localStorage.getItem('elips_sales_v11')) || [];
    let repairs = JSON.parse(localStorage.getItem('elips_repairs_v11')) || [];
    let selectedCat = 'ALL';
    let selectedRepairFilter = 'ALL';

    function normalizeTr(text) {
      if (!text) return "";
      const m = {'ı':'i','İ':'i','ş':'s','Ş':'s','ğ':'g','Ğ':'g','ü':'u','Ü':'u','ö':'o','Ö':'o','ç':'c','Ç':'c'};
      return text.toLowerCase().replace(/[ıİIşŞğĞüÜöÖçÇ]/g, c => m[c] || c);
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stocks));
      localStorage.setItem('elips_sales_v11', JSON.stringify(sales));
      localStorage.setItem('elips_repairs_v11', JSON.stringify(repairs));
    }

    function switchTab(t) {
      document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden'));
      document.getElementById('tab-' + t).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(b => { 
        b.classList.remove('bg-brand-600', 'text-white', 'shadow-md'); b.classList.add('text-slate-400'); 
      });
      document.getElementById('tab-btn-' + t).classList.add('bg-brand-600', 'text-white', 'shadow-md');
      document.getElementById('tab-btn-' + t).classList.remove('text-slate-400');
      if (t === 'reports') renderZReport();
      if (t === 'repair') renderRepairs();
    }

    function filterCategory(cat) {
      selectedCat = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        btn.classList.remove('bg-brand-600', 'text-white');
        btn.classList.add('bg-cardbg', 'border', 'border-bordercol', 'text-slate-300');
      });
      const activeBtn = document.getElementById('pill-' + cat);
      if (activeBtn) {
        activeBtn.classList.remove('bg-cardbg', 'border', 'border-bordercol', 'text-slate-300');
        activeBtn.classList.add('bg-brand-600', 'text-white');
      }
      renderStockTable();
    }

    function renderStockTable() {
      const s = normalizeTr(document.getElementById('stock-search')?.value || "");
      let filtered = stocks.filter(p => {
        const matchesSearch = normalizeTr(p.name).includes(s) || normalizeTr(p.code).includes(s);
        let matchesCat = (selectedCat === 'ALL') ? true : (selectedCat === 'YENI' ? !!p.is_new : p.cat === selectedCat);
        return matchesSearch && matchesCat;
      });

      document.getElementById('count-all').innerText = stocks.length;
      document.getElementById('count-yeni').innerText = stocks.filter(p => p.is_new).length;
      document.getElementById('count-kontrol').innerText = stocks.filter(p => p.cat === 'KONTROL').length;
      document.getElementById('count-elektronik').innerText = stocks.filter(p => p.cat === 'ELEKTRONIK').length;
      document.getElementById('count-mekatronik').innerText = stocks.filter(p => p.cat === 'MEKATRONIK').length;
      document.getElementById('count-repair-active').innerText = repairs.filter(r => r.status !== 'TESLIM').length;

      const listEl = document.getElementById('stock-list');
      if (filtered.length === 0) { listEl.innerHTML = `<div class="p-6 text-center text-xs text-slate-500 bg-cardbg rounded-2xl">Parça bulunamadı.</div>`; return; }

      listEl.innerHTML = filtered.map(i => `
        <div class="bg-cardbg border border-bordercol rounded-2xl p-3 flex justify-between items-center shadow-md">

            <div class="flex items-center space-x-1.5">
              <span class="text-[10px] font-mono font-bold text-white bg-darkbg px-2 py-0.5 rounded border border-emerald-500/40">${i.code}</span>
              ${i.is_new ? '<span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40">YENİ</span>' : ''}
              <button onclick="openEditPartModal('${i.id}')" class="text-slate-400 hover:text-emerald-400 text-xs px-1"><i class="fa-solid fa-pen-to-square"></i></button>
            </div>
            <h4 class="text-xs font-semibold text-white mt-1 leading-tight">${i.name}</h4>
            <p class="text-[10px] text-slate-400 mt-0.5">Konum: <span class="text-slate-300 font-mono">${i.loc}</span></p>
          </div>
          <div class="flex items-center space-x-2">
            <span class="text-xs font-black text-emerald-400 whitespace-nowrap">${i.qty > 0 ? i.qty + ' ADT' : '<span class="text-rose-400">0 ADT</span>'}</span>
            <div class="flex flex-col space-y-1">
              <button onclick="increaseStock('${i.id}')" class="w-6 h-6 bg-darkbg border border-bordercol text-emerald-400 rounded-lg text-xs font-bold">+</button>
              <button onclick="openDeductModal('${i.id}')" class="w-6 h-6 bg-darkbg border border-bordercol text-rose-400 rounded-lg text-xs font-bold">-</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterRepairs(f) {
      selectedRepairFilter = f;
      document.querySelectorAll('.rf-pill').forEach(btn => {
        btn.classList.remove('bg-cyan-600', 'text-white');
        btn.classList.add('bg-cardbg', 'border', 'border-bordercol', 'text-slate-300');
      });
      const activeBtn = document.getElementById('rf-' + f);
      if (activeBtn) {
        activeBtn.classList.remove('bg-cardbg', 'border', 'border-bordercol', 'text-slate-300');
        activeBtn.classList.add('bg-cyan-600', 'text-white');
      }
      renderRepairs();
    }

    function renderRepairs() {
      const container = document.getElementById('repair-list');
      let filtered = repairs;
      if (selectedRepairFilter !== 'ALL') filtered = repairs.filter(r => r.status === selectedRepairFilter);

      document.getElementById('rc-all').innerText = repairs.length;
      document.getElementById('rc-wait').innerText = repairs.filter(r => r.status === 'BEKLEMEDE').length;
      document.getElementById('rc-uz').innerText = repairs.filter(r => r.status === 'OZBEKISTAN').length;
      document.getElementById('rc-tr').innerText = repairs.filter(r => r.status === 'TURKIYE').length;

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6 bg-cardbg rounded-2xl">Kayıtlı tamir kaydı bulunamadı.</p>`;
        return;
      }

      const stBadges = {
        'BEKLEMEDE': '<span class="text-[9px] font-bold px-2 py-0.5 rounded-full bg-amber-950 text-amber-300 border border-amber-700">⏳ Bekliyor</span>',
        'OZBEKISTAN': '<span class="text-[9px] font-bold px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-700">🇺🇿 Özbekistan Onardı</span>',
        'TURKIYE': '<span class="text-[9px] font-bold px-2 py-0.5 rounded-full bg-rose-950 text-rose-300 border border-rose-700">🇹🇷 Türkiye\'de</span>',
        'TESLIM': '<span class="text-[9px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">✅ Teslim Edildi</span>'
      };

      container.innerHTML = filtered.map(r => `
        <div class="bg-cardbg border border-bordercol rounded-2xl p-3.5 space-y-2 shadow-md">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-xs font-bold text-white">${r.firm}</span>
              <span class="text-[11px] text-cyan-400 font-bold ml-1.5">[${r.model}]</span>
              <p class="text-[10px] text-slate-400 mt-0.5 font-mono">SN: ${r.sn || 'YOK'} | ${r.date}</p>
            </div>
            ${stBadges[r.status] || ''}
          </div>
          <div class="bg-darkbg p-2 rounded-xl text-xs">
            <p class="text-slate-300"><b>Arıza:</b> ${r.issue}</p>
            ${r.notes ? `<p class="text-[10px] text-slate-400 mt-0.5"><b>Not:</b> ${r.notes}</p>` : ''}
          </div>
          <div class="flex items-center space-x-1 pt-1 overflow-x-auto no-scrollbar text-[10px] font-bold">
            <button onclick="changeRepairStatus('${r.id}', 'OZBEKISTAN')" class="px-2 py-1 bg-emerald-950 text-emerald-300 border border-emerald-800 rounded-lg whitespace-nowrap">🇺🇿 Özbekistan</button>
            <button onclick="changeRepairStatus('${r.id}', 'TURKIYE')" class="px-2 py-1 bg-rose-950 text-rose-300 border border-rose-800 rounded-lg whitespace-nowrap">🇹🇷 Türkiye</button>
            <button onclick="changeRepairStatus('${r.id}', 'TESLIM')" class="px-2 py-1 bg-slate-800 text-slate-300 border border-slate-600 rounded-lg whitespace-nowrap">✅ Teslim</button>
            <button onclick="deleteRepairRecord('${r.id}')" class="px-2 py-1 bg-darkbg text-rose-400 rounded-lg"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }

    function openRepairModal() { document.getElementById('modal-repair').classList.remove('hidden'); document.getElementById('modal-repair').classList.add('flex'); }
    function closeRepairModal() { document.getElementById('modal-repair').classList.add('hidden'); document.getElementById('modal-repair').classList.remove('flex'); }

    function saveRepairRecord() {
      const firm = document.getElementById('r-firm').value.trim();
      const model = document.getElementById('r-model').value.trim();
      const sn = document.getElementById('r-sn').value.trim();
      const issue = document.getElementById('r-issue').value.trim();
      const status = document.getElementById('r-status').value;
      const notes = document.getElementById('r-notes').value.trim();

      if (!firm || !model || !issue) { alert("Lütfen Firma, Model ve Arıza alanlarını doldurun!"); return; }

      const newRecord = {
        id: "rep-" + Date.now(),
        firm: firm.toUpperCase(),
        model: model.toUpperCase(),
        sn: sn || "YOK",
        issue: issue,
        status: status,
        notes: notes,
        date: new Date().toLocaleDateString('tr-TR')
      };

      repairs.unshift(newRecord);
      persist();
      closeRepairModal();
      renderRepairs();

      const stNames = { 'BEKLEMEDE': 'İncelemede Bekliyor', 'OZBEKISTAN': 'Özbekistan\'da Onarıldı', 'TURKIYE': 'Türkiye\'ye Gönderildi' };
      const payload = {
        direction: "REPAIR_UPDATE",
        firm: newRecord.firm,
        model: newRecord.model,
        sn: newRecord.sn,
        issue: newRecord.issue,
        status_text: stNames[status]
      };
      if (tg?.sendData) tg.sendData(JSON.stringify(payload));
      alert("Ekran tamir kaydı açıldı!");
    }

    function changeRepairStatus(id, newStatus) {
      const r = repairs.find(x => x.id === id);
      if (!r) return;
      r.status = newStatus;
      persist();
      renderRepairs();

      const stNames = { 'OZBEKISTAN': 'Özbekistan\'da Onarıldı', 'TURKIYE': 'Türkiye\'ye Gönderildi', 'TESLIM': 'Müşteriye Teslim Edildi' };
      const payload = {
        direction: "REPAIR_UPDATE",
        firm: r.firm,
        model: r.model,
        sn: r.sn,
        issue: r.issue,
        status_text: stNames[newStatus]
      };
      if (tg?.sendData) tg.sendData(JSON.stringify(payload));
    }

    function deleteRepairRecord(id) {
      if (!confirm("Bu tamir kaydını silmek istediğinize emin misiniz?")) return;
      repairs = repairs.filter(x => x.id !== id);
      persist();
      renderRepairs();
    }

    function openEditPartModal(id) {
      const it = stocks.find(x => x.id === id);
      if (!it) return;
      document.getElementById('edit-id').value = id;
      document.getElementById('edit-code').value = it.code;
      document.getElementById('edit-name').value = it.name;
      document.getElementById('edit-cat').value = it.cat || 'MEKATRONIK';
      document.getElementById('edit-qty').value = it.qty;
      document.getElementById('edit-loc').value = it.loc || 'ELIPS-DEPO';
      document.getElementById('edit-is-new').checked = !!it.is_new;
      document.getElementById('modal-edit-part').classList.remove('hidden');
      document.getElementById('modal-edit-part').classList.add('flex');
    }

    function closeEditPartModal() {
      document.getElementById('modal-edit-part').classList.add('hidden');
      document.getElementById('modal-edit-part').classList.remove('flex');
    }

    function savePartChanges() {
      const id = document.getElementById('edit-id').value;
      const it = stocks.find(x => x.id === id);
      if (!it) return;

      it.code = document.getElementById('edit-code').value.trim();
      it.name = document.getElementById('edit-name').value.trim();
      it.cat = document.getElementById('edit-cat').value;
      it.qty = Math.max(0, parseInt(document.getElementById('edit-qty').value) || 0);
      it.loc = document.getElementById('edit-loc').value.trim() || 'ELIPS-DEPO';
      it.is_new = document.getElementById('edit-is-new').checked;

      persist();
      renderStockTable();
      closeEditPartModal();
    }

    function deletePartFromModal(silent) {
      const id = document.getElementById('edit-id').value;
      const it = stocks.find(x => x.id === id);
      if (!it) return;

      if (!confirm(silent ? `[${it.code}] parçasını BİLDİRİMSİZ depodan silmek istiyor musunuz?` : `[${it.code}] parçasını BİLDİREREK silmek istiyor musunuz?`)) return;

      stocks = stocks.filter(x => x.id !== id);
      persist();
      renderStockTable();
      closeEditPartModal();

      const payload = { direction: "STOCK_DELETE", code: it.code, name: it.name, silent: silent };
      if (tg?.sendData) tg.sendData(JSON.stringify(payload));
    }

    function openDeductModal(id) {
      const it = stocks.find(x => x.id === id);
      if (!it) return;
      document.getElementById('deduct-part-id').value = id;
      document.getElementById('deduct-part-header').innerText = `[${it.code}] ${it.name}`;
      document.getElementById('deduct-qty').value = "1";
      document.getElementById('deduct-destination').value = "";
      document.getElementById('modal-deduct').classList.remove('hidden');
      document.getElementById('modal-deduct').classList.add('flex');
    }

    function closeDeductModal() {
      document.getElementById('modal-deduct').classList.add('hidden');
      document.getElementById('modal-deduct').classList.remove('flex');
    }

    function confirmStockDeduction() {
      const id = document.getElementById('deduct-part-id').value;
      const it = stocks.find(x => x.id === id);
      if (!it) return;
      const qty = parseInt(document.getElementById('deduct-qty').value) || 0;
      const dest = document.getElementById('deduct-destination').value.trim();

      if (qty <= 0 || !dest) { alert("Lütfen firma ve miktar belirtin!"); return; }

      it.qty = Math.max(0, it.qty - qty);
      sales.unshift({
        id: "Q-" + Date.now(),
        firm: dest,
        date: new Date().toLocaleDateString('tr-TR'),
        status: "APPROVED",
        timestamp: new Date().toISOString().split('T')[0],
        items: [{ code: it.code, name: it.name, qty: qty }]
      });

      persist();
      renderStockTable();
      renderZReport();
      closeDeductModal();

      const payload = { direction: "STOCK_CHANGE", action: "DECREASE", delta: qty, code: it.code, name: it.name, destination: dest };
      if (tg?.sendData) tg.sendData(JSON.stringify(payload));
    }

    function increaseStock(id) {
      const it = stocks.find(x => x.id === id);
      if (!it) return;
      it.qty += 1;
      persist();
      renderStockTable();
      const payload = { direction: "STOCK_CHANGE", action: "INCREASE", delta: 1, code: it.code, name: it.name, is_new: it.is_new || false };
      if (tg?.sendData) tg.sendData(JSON.stringify(payload));
    }

    function openStockModal() { document.getElementById('modal-stock').classList.remove('hidden'); document.getElementById('modal-stock').classList.add('flex'); }
    function closeStockModal() { document.getElementById('modal-stock').classList.add('hidden'); document.getElementById('modal-stock').classList.remove('flex'); }

    function saveStockItem() {
      const code = document.getElementById('m-code').value.trim();
      const cat = document.getElementById('m-cat').value;
      const name = document.getElementById('m-name').value.trim();
      const qty = parseInt(document.getElementById('m-qty').value) || 0;
      const loc = document.getElementById('m-loc').value.trim() || 'ELIPS-DEPO';
      const isNew = document.getElementById('m-is-new').checked;

      if (!code || !name) { alert("Lütfen Kod ve İsim alanlarını doldurun!"); return; }

      stocks.unshift({ id: "s" + Date.now(), code, cat, name, qty, loc, is_new: isNew });
      persist();
      closeStockModal();
      renderStockTable();

      const payload = { direction: "STOCK_CHANGE", action: "INCREASE", delta: qty, code, name, is_new: isNew };
      if (tg?.sendData) tg.sendData(JSON.stringify(payload));
    }

    function renderZReport() {
      let filtered = sales.filter(s => s.status === 'APPROVED');
      let totalQty = 0;
      const plants = new Set();
      filtered.forEach(s => {
        plants.add(s.firm);
        s.items.forEach(i => totalQty += parseInt(i.qty || 1));
      });

      document.getElementById('z-total-qty').innerText = `${totalQty} ADT`;
      document.getElementById('z-total-plants').innerText = `${plants.size} Tesis`;

      const listContainer = document.getElementById('z-sales-list');
      if (filtered.length === 0) { listContainer.innerHTML = `<p class="text-xs text-slate-500 text-center py-4 bg-darkbg rounded-xl">Kayıt yok.</p>`; return; }

      listContainer.innerHTML = filtered.map(s => `
        <div class="p-2.5 bg-darkbg border border-bordercol rounded-xl text-xs space-y-1">
          <div class="flex justify-between items-center"><span class="font-bold text-white">${s.firm}</span><span class="text-[10px] text-slate-500">${s.date}</span></div>
          <div class="border-t border-bordercol/30 pt-1">
            ${s.items.map(i => `<span class="text-[11px] text-emerald-400 font-mono">[${i.code}]</span> ${i.name} (<b>${i.qty} Adet</b>)`).join('<br>')}
          </div>
        </div>
      `).join('');
    }

    function exportZReportCSV() {
      const filtered = sales.filter(s => s.status === 'APPROVED');
      if (filtered.length === 0) { alert("Kayıt yok!"); return; }
      let csv = "\uFEFFTarih;Firma;Kod;Urun;Adet\n";
      filtered.forEach(s => { s.items.forEach(i => { csv += `${s.date};"${s.firm}";"${i.code}";"${i.name}";${i.qty}\n`; }); });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `Z_Raporu_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function queryFacilityHistoryLive() {
      const q = normalizeTr(document.getElementById('facility-search-input').value.trim());
      const container = document.getElementById('facility-history-results');
      if (!q) { container.innerHTML = `<p class="text-slate-500 text-center py-2 text-[11px]">Fabrika adı yazın.</p>`; return; }
      const matched = sales.filter(s => s.status === 'APPROVED' && normalizeTr(s.firm).includes(q));
      if (matched.length === 0) { container.innerHTML = `<p class="text-slate-400 text-center py-2 text-[11px]">Kayıt bulunamadı.</p>`; return; }
      container.innerHTML = matched.map(s => `
        <div class="p-2 bg-darkbg border border-bordercol rounded-xl space-y-1 text-xs">
          <div class="flex justify-between text-[11px] font-bold text-white"><span>${s.firm}</span><span>${s.date}</span></div>
          <div class="border-t border-bordercol/40 pt-1">
            ${s.items.map(i => `<p class="text-[11px] text-slate-300">• [${i.code}] ${i.name} (<b>${i.qty} ADT</b>)</p>`).join('')}
          </div>
        </div>
      `).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderStockTable();
      renderRepairs();
      updateOnlineStatus();
    });
  </script>
</body>
</html>
