<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eliar Depo - Parça & İş Paylaşımı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
            darkbg: '#0B0F19', cardbg: '#161F30', bordercol: '#233047'
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    input, textarea, select { user-select: auto; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-darkbg text-slate-100 font-sans antialiased min-h-screen pb-16">

  <!-- ==================== HEADER ==================== -->
  <header class="sticky top-0 z-40 bg-cardbg/95 backdrop-blur border-b border-bordercol px-4 py-3 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-md shadow-brand-500/20">
        <i class="fa-solid fa-boxes-stacked text-white text-base"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-wide text-white leading-tight">ELIAR DEPO</h1>
        <p class="text-[10px] text-emerald-400 font-mono tracking-wider font-semibold">ÖMER ⇄ KAMİL İŞ PAYLAŞIMI</p>
      </div>
    </div>

    <!-- Dil Değiştirici -->
    <div class="flex items-center bg-darkbg border border-bordercol rounded-xl p-1 shadow-inner">
      <button id="lang-tr" onclick="setLanguage('tr')" class="px-2.5 py-1 text-xs font-bold rounded-lg transition-all">TR</button>
      <button id="lang-uz" onclick="setLanguage('uz')" class="px-2.5 py-1 text-xs font-bold rounded-lg transition-all">UZ</button>
    </div>
  </header>

  <!-- ==================== ANA ALAN ==================== -->
  <main class="p-4 max-w-2xl mx-auto space-y-4">

    <!-- 2'Lİ ANA MENÜ (Stok & İş Paylaşımı) -->
    <div class="grid grid-cols-2 gap-2 p-1 bg-cardbg border border-bordercol rounded-2xl text-xs font-semibold">
      <button onclick="switchTab('stock')" id="tab-btn-stock" class="tab-btn py-3 rounded-xl transition-all flex items-center justify-center space-x-2 bg-brand-600 text-white shadow-md">
        <i class="fa-solid fa-boxes-stacked text-sm"></i>
        <span data-i18n="nav_stock">Stok Yönetimi</span>
      </button>
      <button onclick="switchTab('workflow')" id="tab-btn-workflow" class="tab-btn py-3 rounded-xl transition-all flex items-center justify-center space-x-2 text-slate-400">
        <i class="fa-solid fa-share-nodes text-sm"></i>
        <span data-i18n="nav_workflow">İş Paylaşımı</span>
      </button>
    </div>

    <!-- ==================== 1. TAB: KATEGORİZE STOK ==================== -->
    <section id="tab-stock" class="tab-content space-y-3">
      
      <div class="flex space-x-2">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
          <input type="text" id="stock-search" oninput="renderStockTable()" placeholder="Ürün kodu veya isimle ara..." 
            class="w-full bg-cardbg border border-bordercol rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-brand-500 text-white placeholder-slate-500 shadow-inner">
        </div>
        <button onclick="openStockModal()" class="px-3.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold flex items-center space-x-1.5 text-xs shadow-md">
          <i class="fa-solid fa-plus"></i>
          <span data-i18n="btn_add_part">Yeni Parça</span>
        </button>
      </div>

      <!-- Kategori Filtre Butonları -->
      <div class="flex space-x-1.5 overflow-x-auto no-scrollbar py-1 text-xs">
        <button onclick="filterCategory('ALL')" id="pill-ALL" class="cat-pill px-3 py-1.5 rounded-xl font-bold bg-brand-600 text-white shadow-sm whitespace-nowrap transition-all" data-i18n="cat_all">Tümü</button>
        <button onclick="filterCategory('KONTROL')" id="pill-KONTROL" class="cat-pill px-3 py-1.5 rounded-xl font-semibold bg-cardbg border border-bordercol text-slate-300 hover:text-white whitespace-nowrap transition-all" data-i18n="cat_control">Kontrolörler</button>
        <button onclick="filterCategory('ELEKTRONIK')" id="pill-ELEKTRONIK" class="cat-pill px-3 py-1.5 rounded-xl font-semibold bg-cardbg border border-bordercol text-slate-300 hover:text-white whitespace-nowrap transition-all" data-i18n="cat_electronic">Elektronik</button>
        <button onclick="filterCategory('MEKATRONIK')" id="pill-MEKATRONIK" class="cat-pill px-3 py-1.5 rounded-xl font-semibold bg-cardbg border border-bordercol text-slate-300 hover:text-white whitespace-nowrap transition-all" data-i18n="cat_mechatronic">Mekatronik</button>
      </div>

      <!-- Ürün Kartları -->
      <div id="stock-list" class="space-y-2"></div>
    </section>

    <!-- ==================== 2. TAB: İŞ PAYLAŞIMI ==================== -->
    <section id="tab-workflow" class="tab-content hidden space-y-4">
      
      <!-- AKIŞ SEÇİCİ -->
      <div class="grid grid-cols-2 p-1 bg-darkbg border border-bordercol rounded-2xl gap-1">
        <button onclick="setWorkflowDirection('OMER_TO_KAMIL')" id="btn-flow-otk" 
          class="py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 bg-brand-600 text-white shadow-md">
          <i class="fa-solid fa-user-gear"></i>
          <span data-i18n="btn_tab_request">Sahadan Talep</span>
        </button>
        <button onclick="setWorkflowDirection('KAMIL_TO_OMER')" id="btn-flow-kto" 
          class="py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 text-slate-400 hover:text-white">
          <i class="fa-solid fa-paper-plane"></i>
          <span data-i18n="btn_tab_dispatch">Sahaya İş Gönder</span>
        </button>
      </div>

      <!-- AKIŞ 1: SAHADAN TALEP (ÖMER ➔ KAMİL) -->
      <div id="form-omer-to-kamil" class="bg-cardbg border border-bordercol rounded-2xl p-4 shadow-xl space-y-3">
        <div class="border-b border-bordercol pb-2">
          <h2 class="text-sm font-bold text-white flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
            <span data-i18n="title_otk">Sahadan Talep (Ömer ➔ Kamil)</span>
          </h2>
          <p class="text-[11px] text-slate-400 mt-0.5" data-i18n="desc_otk">Talep doğrudan Kamil'e interaktif onay butonu olarak iletilir.</p>
        </div>

        <div>
          <label class="text-xs text-slate-400 font-semibold flex items-center">
            <span data-i18n="lbl_request_type">Talep Türü</span> <span class="text-rose-400 ml-1">*</span>
          </label>
          <select id="otk-req-type" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500 font-medium">
            <option value="PARCA" data-i18n="opt_part_req">📦 Parça Talebi</option>
            <option value="SERVIS" data-i18n="opt_serv_req">🛠️ Servis Talebi</option>
            <option value="SERVIS_PARCA" data-i18n="opt_both_req">⚡ Servis + Parça Talebi</option>
          </select>
        </div>

        <div class="space-y-2">
          <div>
            <label class="text-xs text-slate-400 font-semibold flex items-center">
              <span data-i18n="lbl_firm_name">Müşteri / Fabrika Adı</span> <span class="text-rose-400 ml-1">*</span>
            </label>
            <input type="text" id="otk-firm-name" placeholder="Fabrika Adı" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="text-xs text-slate-400 font-semibold flex items-center">
              <span data-i18n="lbl_firm_contact">Yetkili Kişi & Telefon</span>
            </label>
            <input type="text" id="otk-firm-contact" placeholder="İsim ve Numara" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <!-- Akıllı Ürün Arama -->
        <div class="relative">
          <label class="text-xs text-slate-400 font-semibold flex items-center justify-between">
            <span class="flex items-center"><span data-i18n="lbl_search_part">İstenen Ürün / Parça</span> <span class="text-rose-400 ml-1">*</span></span>
            <span id="otk-selected-badge" class="text-[10px] text-emerald-400 font-mono font-bold hidden"></span>
          </label>
          
          <div class="relative mt-1">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-xs"></i>
            <input type="text" id="otk-part-search" 
              oninput="searchPartsLive(this.value)" 
              onfocus="searchPartsLive(this.value)" 
              placeholder="Ürün adı veya kodu yazın..." 
              autocomplete="off" 
              class="w-full bg-darkbg border border-bordercol rounded-xl pl-8 pr-8 py-2 text-sm text-white focus:outline-none focus:border-brand-500 font-medium">
            
            <button type="button" onclick="clearPartSelection()" id="otk-clear-btn" class="hidden absolute right-2.5 top-2.5 text-slate-400 hover:text-white text-xs">✕</button>
          </div>

          <div id="otk-part-dropdown" class="absolute z-30 left-0 right-0 mt-1 bg-cardbg border border-bordercol rounded-xl shadow-2xl max-h-56 overflow-y-auto hidden divide-y divide-bordercol/50"></div>
          <input type="hidden" id="otk-selected-code" value="">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-slate-400 font-semibold flex items-center">
              <span data-i18n="lbl_quantity">Miktar</span> <span class="text-rose-400 ml-1">*</span>
            </label>
            <input type="number" id="otk-qty" value="1" min="1" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
          </div>
          <div>
            <label class="text-xs text-slate-400 font-semibold">Durum</label>
            <select id="otk-priority" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
              <option value="NORMAL" data-i18n="prio_normal">Normal Servis</option>
              <option value="KRITIK" class="text-rose-400" data-i18n="prio_critical">Acil (Hat Duruşu!)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_note_otk">Ömer'in Notu</label>
          <textarea id="otk-notes" rows="2" placeholder="Açıklama veya arıza detayı..." class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white placeholder-slate-600"></textarea>
        </div>

        <button onclick="dispatchOmerToKamil()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold flex items-center justify-center space-x-2 text-sm shadow-lg shadow-emerald-900/30">
          <i class="fa-brands fa-telegram text-base"></i>
          <span data-i18n="btn_send_kamil">Kamil'e Gönder & Onay İste</span>
        </button>
      </div>

      <!-- AKIŞ 2: SAHAYA İŞ GÖNDER (KAMİL ➔ ÖMER) -->
      <div id="form-kamil-to-omer" class="bg-cardbg border border-bordercol rounded-2xl p-4 shadow-xl space-y-3 hidden">
        <div class="border-b border-bordercol pb-2">
          <h2 class="text-sm font-bold text-white flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
            <span data-i18n="title_kto">Sahaya İş Gönder (Kamil ➔ Ömer)</span>
          </h2>
          <p class="text-[11px] text-slate-400 mt-0.5" data-i18n="desc_kto">Kamil görevi serbestçe yazar, Ömer'in telefonuna anlık iş emri düşer.</p>
        </div>

        <div class="space-y-2">
          <div>
            <label class="text-xs text-slate-400 font-semibold flex items-center">
              <span data-i18n="lbl_firm_name">Gidilecek Müşteri / Tesis Adı</span> <span class="text-rose-400 ml-1">*</span>
            </label>
            <input type="text" id="kto-firm-name" placeholder="Tesis Adı" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
          </div>
          <div>
            <label class="text-xs text-slate-400 font-semibold flex items-center">
              <span data-i18n="lbl_firm_contact">Tesis Sorumlusu & Telefon</span>
            </label>
            <input type="text" id="kto-firm-contact" placeholder="İsim ve Numara" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
          </div>
        </div>

        <div>
          <label class="text-xs text-slate-400 font-semibold flex items-center">
            <span data-i18n="lbl_task_free">Görev Tipi / Başlığı</span> <span class="text-rose-400 ml-1">*</span>
          </label>
          <input type="text" id="kto-task-type" placeholder="Arıza veya görev başlığı" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 font-medium">
        </div>

        <div>
          <label class="text-xs text-slate-400 font-semibold">Kamil'in Talimatı & Detaylar</label>
          <textarea id="kto-instructions" rows="3" placeholder="Talimatlar..." class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white placeholder-slate-600"></textarea>
        </div>

        <button onclick="dispatchKamilToOmer()" class="w-full bg-cyan-600 hover:bg-cyan-500 py-3 rounded-xl font-bold flex items-center justify-center space-x-2 text-sm shadow-lg shadow-cyan-900/30">
          <i class="fa-solid fa-paper-plane text-base"></i>
          <span data-i18n="btn_send_omer">Sahaya İş Gönder (Ömer'e Fırlat)</span>
        </button>
      </div>

    </section>

  </main>

  <!-- ==================== MODAL: KOLAY STOK DÜŞÜŞÜ / SATIŞ ==================== -->
  <div id="modal-deduct" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-cardbg border border-bordercol w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-bordercol pb-2">
        <div>
          <h3 class="font-bold text-white text-sm" data-i18n="modal_deduct_title">Stok Çıkışı / Satış</h3>
          <p id="deduct-part-header" class="text-[11px] text-emerald-400 font-mono font-semibold mt-0.5"></p>
        </div>
        <button onclick="closeDeductModal()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white rounded-lg bg-darkbg">✕</button>
      </div>

      <!-- Kaç Adet Düşülecek? -->
      <div>
        <div class="flex justify-between items-center text-xs">
          <label class="text-slate-400 font-semibold flex items-center">
            <span data-i18n="lbl_deduct_qty">Düşülecek Miktar</span> <span class="text-rose-400 ml-1">*</span>
          </label>
          <span id="deduct-current-stock" class="text-slate-400 font-mono"></span>
        </div>
        <div class="flex items-center space-x-2 mt-1.5">
          <input type="number" id="deduct-qty" value="1" min="1" class="flex-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-white font-bold text-center text-base focus:border-brand-500">
          <div class="flex space-x-1">
            <button onclick="setDeductQty(1)" class="px-2.5 py-2 bg-darkbg border border-bordercol hover:bg-slate-800 text-xs font-bold rounded-xl text-slate-300">+1</button>
            <button onclick="setDeductQty(2)" class="px-2.5 py-2 bg-darkbg border border-bordercol hover:bg-slate-800 text-xs font-bold rounded-xl text-slate-300">+2</button>
            <button onclick="setDeductQty(5)" class="px-2.5 py-2 bg-darkbg border border-bordercol hover:bg-slate-800 text-xs font-bold rounded-xl text-slate-300">+5</button>
          </div>
        </div>
      </div>

      <!-- Nereye Satıldı? -->
      <div>
        <label class="text-xs text-slate-400 font-semibold flex items-center">
          <span data-i18n="lbl_destination">Satılan Tesis / Müşteri</span> <span class="text-rose-400 ml-1">*</span>
        </label>
        <input type="text" id="deduct-destination" placeholder="Tesis Adı" class="w-full mt-1.5 bg-darkbg border border-bordercol rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
      </div>

      <input type="hidden" id="deduct-part-id" value="">

      <button onclick="confirmStockDeduction()" class="w-full bg-rose-600 hover:bg-rose-500 py-3 rounded-xl font-bold text-white text-sm shadow-lg shadow-rose-900/30 flex items-center justify-center space-x-2">
        <i class="fa-solid fa-arrow-down-from-bracket"></i>
        <span data-i18n="btn_confirm_deduct">Stoktan Düş & Bildir</span>
      </button>
    </div>
  </div>

  <!-- ==================== MODAL: YENİ PARÇA EKLE (FİYATSIZ) ==================== -->
  <div id="modal-stock" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-cardbg border border-bordercol w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-3">
      <div class="flex justify-between items-center border-b border-bordercol pb-2">
        <h3 class="font-bold text-white text-sm" data-i18n="modal_add_title">Yeni Endüstriyel Parça</h3>
        <button onclick="closeStockModal()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white rounded-lg bg-darkbg">✕</button>
      </div>
      
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs text-slate-400 font-medium flex items-center">
            <span>Ürün Kodu</span> <span class="text-rose-400 ml-1">*</span>
          </label>
          <input type="text" id="m-code" placeholder="EL-PLC-T390" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white font-mono focus:border-brand-500">
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium flex items-center">
            <span data-i18n="lbl_category">Kategori</span> <span class="text-rose-400 ml-1">*</span>
          </label>
          <select id="m-cat" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-2.5 py-2 text-sm text-white">
            <option value="KONTROL">Kontrolörler</option>
            <option value="ELEKTRONIK">Elektronik</option>
            <option value="MEKATRONIK">Mekatronik</option>
          </select>
        </div>
      </div>

      <div>
        <label class="text-xs text-slate-400 font-medium flex items-center">
          <span>Parça İsmi</span> <span class="text-rose-400 ml-1">*</span>
        </label>
        <input type="text" id="m-name" placeholder="Eliar T800 Boya Kontrolörü" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:border-brand-500">
      </div>
      
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs text-slate-400 font-medium flex items-center">
            <span>Miktar</span> <span class="text-rose-400 ml-1">*</span>
          </label>
          <input type="number" id="m-qty" value="1" min="0" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium flex items-center">
            <span>Konum / Raf</span> <span class="text-rose-400 ml-1">*</span>
          </label>
          <input type="text" id="m-loc" placeholder="ÖMER-ARAÇ-RAF1" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:border-brand-500">
        </div>
      </div>

      <button onclick="saveStockItem()" class="w-full bg-brand-600 hover:bg-brand-500 py-2.5 rounded-xl font-bold text-white text-sm shadow-lg shadow-brand-900/30" data-i18n="btn_save_item">Stoka Kaydet & Bildir</button>
    </div>
  </div>

  <!-- ==================== UYGULAMA MOTORU ==================== -->
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
      tg.setHeaderColor('#161F30');
      tg.setBackgroundColor('#0B0F19');
    }

    const I18N = {
      tr: {
        nav_stock: "Stok Yönetimi", nav_workflow: "İş Paylaşımı",
        cat_all: "Tümü", cat_control: "Kontrolörler", cat_electronic: "Elektronik", cat_mechatronic: "Mekatronik",
        btn_tab_request: "Sahadan Talep", btn_tab_dispatch: "Sahaya İş Gönder",
        title_otk: "Sahadan Talep (Ömer ➔ Kamil)",
        desc_otk: "Talep doğrudan Kamil'e interaktif onay butonu olarak iletilir.",
        title_kto: "Sahaya İş Gönder (Kamil ➔ Ömer)",
        desc_kto: "Kamil görevi serbestçe yazar, Ömer'in telefonuna anlık iş emri düşer.",
        lbl_request_type: "Talep Türü",
        opt_part_req: "📦 Parça Talebi", opt_serv_req: "🛠️ Servis Talebi", opt_both_req: "⚡ Servis + Parça Talebi",
        lbl_firm_name: "Müşteri / Fabrika Adı",
        lbl_firm_contact: "Yetkili Kişi & Telefon",
        lbl_search_part: "İstenen Ürün / Parça",
        lbl_quantity: "Miktar",
        lbl_priority: "Öncelik Seviyesi",
        prio_normal: "Normal Servis",
        prio_critical: "Acil (Hat Duruşu!)",
        lbl_note_otk: "Ömer'in Notu",

    let currentLang = localStorage.getItem('eliar_lang') || 'tr';
    let currentFlow = 'OMER_TO_KAMIL';
    let selectedCat = 'ALL';

    // Fiyatsız Başlangıç Verileri
    const DEFAULT_STOCKS = [
      { id: "1", code: "EL-PLC-T390", name: "Eliar T390 Boya Kontrolörü", cat: "KONTROL", qty: 6, loc: "ÖMER-ARAÇ-RAF1" },
      { id: "2", code: "EL-MOD-16DI", name: "16 Kanal Dijital Giriş Modülü", cat: "ELEKTRONIK", qty: 18, loc: "ÖMER-ARAÇ-RAF2" },
      { id: "3", code: "EL-SEN-PT100", name: "PT100 Sıcaklık Sensörü 3m", cat: "ELEKTRONIK", qty: 25, loc: "ÖMER-ÇANTA" },
      { id: "4", code: "EL-VLV-DN25", name: "Oransal Buhar Vanası Motorlu DN25", cat: "MEKATRONIK", qty: 3, loc: "MERKEZ-DEPO-B2" },
      { id: "5", code: "EL-INV-5KW", name: "5.5kW Asenkron Motor Sürücüsü", cat: "MEKATRONIK", qty: 4, loc: "MERKEZ-DEPO-A1" },
      { id: "6", code: "41835", name: "Apexco Salmastra 7003TTG-20", cat: "MEKATRONIK", qty: 5, loc: "MERKEZ-DEPO" }
    ];

    let stocks = JSON.parse(localStorage.getItem('eliar_stocks')) || DEFAULT_STOCKS;

    function persist() {
      localStorage.setItem('eliar_stocks', JSON.stringify(stocks));
    }

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('eliar_lang', lang);
      document.getElementById('lang-tr').className = lang === 'tr' ? "px-2.5 py-1 text-xs font-bold rounded-lg bg-brand-600 text-white" : "px-2.5 py-1 text-xs font-bold rounded-lg text-slate-400";
      document.getElementById('lang-uz').className = lang === 'uz' ? "px-2.5 py-1 text-xs font-bold rounded-lg bg-brand-600 text-white" : "px-2.5 py-1 text-xs font-bold rounded-lg text-slate-400";
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (I18N[lang][k]) el.innerText = I18N[lang][k];
      });
      renderStockTable();
    }

    function switchTab(t) {
      document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden'));
      document.getElementById('tab-' + t).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('bg-brand-600', 'text-white'); b.classList.add('text-slate-400'); });
      document.getElementById('tab-btn-' + t).classList.add('bg-brand-600', 'text-white');
    }

    function setWorkflowDirection(dir) {
      currentFlow = dir;
      if (dir === 'OMER_TO_KAMIL') {
        document.getElementById('btn-flow-otk').className = "py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 bg-brand-600 text-white shadow-md";
        document.getElementById('btn-flow-kto').className = "py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 text-slate-400 hover:text-white";
        document.getElementById('form-omer-to-kamil').classList.remove('hidden');
        document.getElementById('form-kamil-to-omer').classList.add('hidden');
      } else {
        document.getElementById('btn-flow-kto').className = "py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 bg-cyan-600 text-white shadow-md";
        document.getElementById('btn-flow-otk').className = "py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 text-slate-400 hover:text-white";
        document.getElementById('form-kamil-to-omer').classList.remove('hidden');
        document.getElementById('form-omer-to-kamil').classList.add('hidden');
      }
    }

    function filterCategory(cat) {
      selectedCat = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        btn.classList.remove('bg-brand-600', 'text-white', 'shadow-sm');
        btn.classList.add('bg-cardbg', 'border', 'border-bordercol', 'text-slate-300');
      });
      const activeBtn = document.getElementById('pill-' + cat);
      if (activeBtn) {
        activeBtn.classList.remove('bg-cardbg', 'border', 'border-bordercol', 'text-slate-300');
        activeBtn.classList.add('bg-brand-600', 'text-white', 'shadow-sm');
      }
      renderStockTable();
    }

    function getCategoryBadge(cat) {
      if (cat === 'KONTROL') {
        return `<span class="text-[9px] font-bold px-2 py-0.5 rounded-md bg-emerald-950 text-emerald-400 border border-emerald-800 flex items-center space-x-1">
          <i class="fa-solid fa-microchip text-[8px] mr-1"></i>${I18N[currentLang].cat_control}
        </span>`;
      } else if (cat === 'ELEKTRONIK') {
        return `<span class="text-[9px] font-bold px-2 py-0.5 rounded-md bg-amber-950 text-amber-400 border border-amber-800 flex items-center space-x-1">
          <i class="fa-solid fa-bolt text-[8px] mr-1"></i>${I18N[currentLang].cat_electronic}
        </span>`;
      } else {
        return `<span class="text-[9px] font-bold px-2 py-0.5 rounded-md bg-purple-950 text-purple-400 border border-purple-800 flex items-center space-x-1">
          <i class="fa-solid fa-gears text-[8px] mr-1"></i>${I18N[currentLang].cat_mechatronic}
        </span>`;
      }
    }

    function renderStockTable() {
      const s = document.getElementById('stock-search')?.value.toLowerCase() || "";
      const filtered = stocks.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(s) || p.code.toLowerCase().includes(s);
        const matchesCat = (selectedCat === 'ALL') || (p.cat === selectedCat);
        return matchesSearch && matchesCat;
      });

      if (filtered.length === 0) {
        document.getElementById('stock-list').innerHTML = `<div class="p-6 text-center text-xs text-slate-500 bg-cardbg rounded-2xl border border-bordercol">Bu kategoride parça bulunamadı.</div>`;
        return;
      }

      document.getElementById('stock-list').innerHTML = filtered.map(i => `
        <div class="bg-cardbg border border-bordercol rounded-2xl p-3 flex justify-between items-center shadow-md hover:border-slate-600 transition">
          <div>
            <div class="flex items-center space-x-2">
              <span class="text-[10px] font-mono font-bold text-white bg-darkbg px-2 py-0.5 rounded border border-emerald-500/40 tracking-wider">${i.code}</span>
              ${getCategoryBadge(i.cat || 'KONTROL')}
            </div>
            <h4 class="text-sm font-semibold text-white mt-1 leading-tight">${i.name}</h4>
            <p class="text-xs text-slate-400 mt-0.5">${I18N[currentLang].shelf}: <span class="text-slate-300 font-mono">${i.loc}</span></p>
          </div>
          <div class="flex items-center space-x-2">
            <span class="text-sm font-black text-emerald-400 whitespace-nowrap">${i.qty} ADT</span>
            <div class="flex flex-col space-y-1">
              <button onclick="increaseStock('${i.id}')" title="Stok Ekle (+1)" class="w-7 h-7 bg-darkbg border border-bordercol hover:bg-emerald-950 text-emerald-400 rounded-lg text-xs font-bold flex items-center justify-center active:scale-95">+</button>
              <button onclick="openDeductModal('${i.id}')" title="Stoktan Düş / Satış Yap" class="w-7 h-7 bg-darkbg border border-bordercol hover:bg-rose-950 text-rose-400 rounded-lg text-xs font-bold flex items-center justify-center active:scale-95">-</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    /* ==================== HIZLI VE KOLAY STOK DÜŞÜŞ MOTORU ==================== */
    function openDeductModal(id) {
      const it = stocks.find(x => x.id === id);
      if (!it) return;
      if (it.qty <= 0) {
        alert("Bu parçanın stoğu zaten tükenmiş!");
        return;
      }

      document.getElementById('deduct-part-id').value = id;
      document.getElementById('deduct-part-header').innerText = `[${it.code}] ${it.name}`;
      document.getElementById('deduct-current-stock').innerText = `Mevcut: ${it.qty} ADT`;
      document.getElementById('deduct-qty').value = "1";
      document.getElementById('deduct-qty').max = it.qty;
      document.getElementById('deduct-destination').value = "";

      document.getElementById('modal-deduct').classList.remove('hidden');
      document.getElementById('modal-deduct').classList.add('flex');
      setTimeout(() => document.getElementById('deduct-destination').focus(), 100);
    }

    function closeDeductModal() {
      document.getElementById('modal-deduct').classList.add('hidden');
      document.getElementById('modal-deduct').classList.remove('flex');
    }

    function setDeductQty(delta) {
      const input = document.getElementById('deduct-qty');
      const max = parseInt(input.max) || 999;
      let val = parseInt(input.value) || 1;
      val += delta;
      if (val > max) val = max;
      if (val < 1) val = 1;
      input.value = val;
    }

    function confirmStockDeduction() {
      const id = document.getElementById('deduct-part-id').value;
      const it = stocks.find(x => x.id === id);
      if (!it) return;

      const qtyToDeduct = parseInt(document.getElementById('deduct-qty').value) || 0;
      const destination = document.getElementById('deduct-destination').value.trim();

      if (qtyToDeduct <= 0) {
        alert("Geçerli bir miktar girin!");
        return;
      }

      if (qtyToDeduct > it.qty) {
        alert(`Mevcut stoktan (${it.qty}) daha fazla parça düşülemez!`);
        return;
      }

      if (!destination) {
        alert("Satılan tesis / müşteri adı boş bırakılamaz!");
        document.getElementById('deduct-destination').focus();
        return;
      }

      it.qty -= qtyToDeduct;
      persist();
      renderStockTable();
      closeDeductModal();

      const payload = {
        direction: "STOCK_CHANGE",
        action: "DECREASE",
        delta: qtyToDeduct,
        category: it.cat || "KONTROL",
        code: it.code,
        name: it.name,
        current_qty: it.qty,
        destination: destination,
        loc: it.loc
      };

      if (tg?.sendData) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert(`[Test Modu] ${it.code} stoktan ${qtyToDeduct} adet düşüldü. Kalan: ${it.qty}. Tesis: ${destination}`);
      }
    }

    function increaseStock(id) {
      const it = stocks.find(x => x.id === id);
      if (!it) return;

      if (!confirm(`[${it.code}] için stok +1 artırılsın mı?`)) return;

      it.qty += 1;
      persist();
      renderStockTable();

      const payload = {
        direction: "STOCK_CHANGE",
        action: "INCREASE",
        delta: 1,
        category: it.cat || "KONTROL",
        code: it.code,
        name: it.name,
        current_qty: it.qty,
        loc: it.loc
      };

      if (tg?.sendData) tg.sendData(JSON.stringify(payload));
    }

    /* ==================== AKILLI CANLI ÜRÜN ARAMA ==================== */
    function searchPartsLive(query) {
      const dropdown = document.getElementById('otk-part-dropdown');
      const q = (query || "").trim().toLowerCase();

      const matches = stocks.filter(p => 
        p.name.toLowerCase().includes(q) || 
        p.code.toLowerCase().includes(q)
      );

      if (matches.length === 0) {
        dropdown.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">Eşleşen parça bulunamadı.</div>`;
        dropdown.classList.remove('hidden');
        return;
      }

      dropdown.innerHTML = matches.map(p => `
        <div onclick="selectPart('${p.code}', '${p.name.replace(/'/g, "\\'")}', '${p.qty}')" 
          class="p-2.5 hover:bg-slate-800/80 cursor-pointer transition flex items-center justify-between">
          <div>
            <div class="flex items-center space-x-1.5">
              <span class="text-[10px] font-mono font-bold bg-darkbg border border-bordercol px-1.5 py-0.5 rounded text-emerald-400">${p.code}</span>
              <span class="text-[9px] text-slate-400 font-semibold">[${p.cat}]</span>
            </div>
            <p class="text-xs font-semibold text-white mt-1 leading-snug">${p.name}</p>
          </div>
          <div class="text-right pl-2">
            <span class="text-xs font-bold text-emerald-400 block">${p.qty} ADT</span>
            <span class="text-[10px] text-slate-400 font-mono">${p.loc}</span>
          </div>
        </div>
      `).join('');

      dropdown.classList.remove('hidden');
    }

    function selectPart(code, name, qty) {
      document.getElementById('otk-selected-code').value = code;
      document.getElementById('otk-part-search').value = `${name} [${code}]`;
      
      const badge = document.getElementById('otk-selected-badge');
      badge.innerText = `✓ Kod: ${code} (Stok: ${qty} ADT)`;
      badge.classList.remove('hidden');

      document.getElementById('otk-clear-btn').classList.remove('hidden');
      document.getElementById('otk-part-dropdown').classList.add('hidden');
    }

    function clearPartSelection() {
      document.getElementById('otk-selected-code').value = "";
      document.getElementById('otk-part-search').value = "";
      document.getElementById('otk-selected-badge').classList.add('hidden');
      document.getElementById('otk-clear-btn').classList.add('hidden');
      document.getElementById('otk-part-dropdown').classList.add('hidden');
    }

    document.addEventListener('click', (e) => {
      const dropdown = document.getElementById('otk-part-dropdown');
      const searchInput = document.getElementById('otk-part-search');
      if (dropdown && !dropdown.contains(e.target) && e.target !== searchInput) {
        dropdown.classList.add('hidden');
      }
    });

    function openStockModal() { document.getElementById('modal-stock').classList.remove('hidden'); document.getElementById('modal-stock').classList.add('flex'); }
    function closeStockModal() { document.getElementById('modal-stock').classList.add('hidden'); document.getElementById('modal-stock').classList.remove('flex'); }

    /* ==================== YENİ ÜRÜN EKLEME (FİYATSIZ) ==================== */
    function saveStockItem() {
      const code = document.getElementById('m-code').value.trim();
      const cat = document.getElementById('m-cat').value;
      const name = document.getElementById('m-name').value.trim();
      const qty = parseInt(document.getElementById('m-qty').value) || 0;
      const loc = document.getElementById('m-loc').value.trim();
      
      if (!code) {
        alert("Ürün kodu zorunludur!");
        document.getElementById('m-code').focus();
        return;
      }

      if (!name) {
        alert("Parça ismi zorunludur!");
        document.getElementById('m-name').focus();
        return;
      }

      if (!loc) {
        alert("Konum / Raf bilgisi zorunludur!");
        document.getElementById('m-loc').focus();
        return;
      }

      const existing = stocks.find(p => p.code.toLowerCase() === code.toLowerCase());
      if (existing) {
        alert(`'${code}' ürün kodu zaten mevcut!`);
        return;
      }
      
      stocks.unshift({ id: Date.now().toString(), code, cat, name, qty, loc });
      persist();
      closeStockModal();
      renderStockTable();

      const payload = {
        direction: "STOCK_CHANGE",
        action: "NEW_ITEM",
        category: cat,
        code: code,
        name: name,
        qty: qty,
        loc: loc
      };

      if (tg?.sendData) tg.sendData(JSON.stringify(payload));
      
      document.getElementById('m-code').value = "";
      document.getElementById('m-name').value = "";
      document.getElementById('m-loc').value = "";
    }

    function dispatchOmerToKamil() {
      const firmName = document.getElementById('otk-firm-name').value.trim();
      const firmContact = document.getElementById('otk-firm-contact').value.trim();
      const reqType = document.getElementById('otk-req-type').value;
      const partCode = document.getElementById('otk-selected-code').value;

      if (!firmName) {
        alert("Müşteri / Fabrika adı zorunludur!");
        document.getElementById('otk-firm-name').focus();
        return;
      }

      if (!partCode) {
        alert("Talep edilecek ürünü arama kutusundan seçin!");
        document.getElementById('otk-part-search').focus();
        return;
      }

      const partObj = stocks.find(p => p.code === partCode);

      const payload = {
        direction: "OMER_TO_KAMIL",
        request_type: reqType,
        firm: firmName,
        contact: firmContact || "Belirtilmedi",
        category: partObj?.cat || "GENEL",
        part_code: partCode,
        part_name: partObj?.name || "",
        quantity: document.getElementById('otk-qty').value,
        priority: document.getElementById('otk-priority').value,
        notes: document.getElementById('otk-notes').value
      };

      if (tg?.sendData) tg.sendData(JSON.stringify(payload));
    }

    function dispatchKamilToOmer() {
      const firmName = document.getElementById('kto-firm-name').value.trim();
      const firmContact = document.getElementById('kto-firm-contact').value.trim();
      const taskType = document.getElementById('kto-task-type').value.trim();

      if (!firmName) {
        alert("Gidilecek müşteri / tesis adı zorunludur!");
        document.getElementById('kto-firm-name').focus();
        return;
      }

      if (!taskType) {
        alert("Görev tipi / başlığı zorunludur!");
        document.getElementById('kto-task-type').focus();
        return;
      }

      const payload = {
        direction: "KAMIL_TO_OMER",
        firm: firmName,
        contact: firmContact || "Belirtilmedi",
        task_type: taskType,
        instructions: document.getElementById('kto-instructions').value
      };

      if (tg?.sendData) tg.sendData(JSON.stringify(payload));
    }

    window.addEventListener('DOMContentLoaded', () => {
      setLanguage(currentLang);
      switchTab('stock');
      filterCategory('ALL');
    });
  </script>
