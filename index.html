<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eliar Depo - İş Paylaşımı & Canlı Stok</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
            darkbg: '#0B0F19', cardbg: '#161F30', bordercol: '#233047'
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    input, textarea, select { user-select: auto; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-darkbg text-slate-100 font-sans antialiased min-h-screen pb-16">

  <!-- ==================== HEADER ==================== -->
  <header class="sticky top-0 z-40 bg-cardbg/95 backdrop-blur border-b border-bordercol px-4 py-3 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-md shadow-brand-500/20">
        <i class="fa-solid fa-layer-group text-white text-base"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-wide text-white leading-tight">ELIAR DEPO</h1>
        <p class="text-[10px] text-emerald-400 font-mono tracking-wider font-semibold">ÖMER ⇄ KAMİL İŞ PAYLAŞIMI</p>
      </div>
    </div>

    <!-- Dil Değiştirici -->
    <div class="flex items-center bg-darkbg border border-bordercol rounded-xl p-1 shadow-inner">
      <button id="lang-tr" onclick="setLanguage('tr')" class="px-2.5 py-1 text-xs font-bold rounded-lg transition-all">TR</button>
      <button id="lang-uz" onclick="setLanguage('uz')" class="px-2.5 py-1 text-xs font-bold rounded-lg transition-all">UZ</button>
    </div>
  </header>

  <!-- ==================== ANA ALAN ==================== -->
  <main class="p-4 max-w-2xl mx-auto space-y-4">

    <!-- 2'Lİ ANA MENÜ (Stok & İş Paylaşımı) -->
    <div class="grid grid-cols-2 gap-2 p-1 bg-cardbg border border-bordercol rounded-2xl text-xs font-semibold">
      <button onclick="switchTab('stock')" id="tab-btn-stock" class="tab-btn py-3 rounded-xl transition-all flex items-center justify-center space-x-2 bg-brand-600 text-white shadow-md">
        <i class="fa-solid fa-boxes-stacked text-sm"></i>
        <span data-i18n="nav_stock">Stok Yönetimi</span>
      </button>
      <button onclick="switchTab('workflow')" id="tab-btn-workflow" class="tab-btn py-3 rounded-xl transition-all flex items-center justify-center space-x-2 text-slate-400">
        <i class="fa-solid fa-share-nodes text-sm"></i>
        <span data-i18n="nav_workflow">İş Paylaşımı</span>
      </button>
    </div>

    <!-- ==================== 1. TAB: KATEGORİZE STOK ==================== -->
    <section id="tab-stock" class="tab-content space-y-3">
      
      <div class="flex space-x-2">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
          <input type="text" id="stock-search" oninput="renderStockTable()" placeholder="Ürün kodu veya isimle ara..." 
            class="w-full bg-cardbg border border-bordercol rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-brand-500 text-white placeholder-slate-500 shadow-inner">
        </div>
        <button onclick="openStockModal()" class="px-3.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold flex items-center space-x-1.5 text-xs shadow-md">
          <i class="fa-solid fa-plus"></i>
          <span data-i18n="btn_add_part">Yeni Parça</span>
        </button>
      </div>

      <!-- Kategori Filtre Butonları -->
      <div class="flex space-x-1.5 overflow-x-auto no-scrollbar py-1 text-xs">
        <button onclick="filterCategory('ALL')" id="pill-ALL" class="cat-pill px-3 py-1.5 rounded-xl font-bold bg-brand-600 text-white shadow-sm whitespace-nowrap transition-all" data-i18n="cat_all">Tümü</button>
        <button onclick="filterCategory('KONTROL')" id="pill-KONTROL" class="cat-pill px-3 py-1.5 rounded-xl font-semibold bg-cardbg border border-bordercol text-slate-300 hover:text-white whitespace-nowrap transition-all" data-i18n="cat_control">Kontrolörler</button>
        <button onclick="filterCategory('ELEKTRONIK')" id="pill-ELEKTRONIK" class="cat-pill px-3 py-1.5 rounded-xl font-semibold bg-cardbg border border-bordercol text-slate-300 hover:text-white whitespace-nowrap transition-all" data-i18n="cat_electronic">Elektronik</button>
        <button onclick="filterCategory('MEKATRONIK')" id="pill-MEKATRONIK" class="cat-pill px-3 py-1.5 rounded-xl font-semibold bg-cardbg border border-bordercol text-slate-300 hover:text-white whitespace-nowrap transition-all" data-i18n="cat_mechatronic">Mekatronik</button>
      </div>

      <!-- Ürün Kartları -->
      <div id="stock-list" class="space-y-2"></div>
    </section>

    <!-- ==================== 2. TAB: İŞ PAYLAŞIMI ==================== -->
    <section id="tab-workflow" class="tab-content hidden space-y-4">
      
      <!-- AKIŞ SEÇİCİ -->
      <div class="grid grid-cols-2 p-1 bg-darkbg border border-bordercol rounded-2xl gap-1">
        <button onclick="setWorkflowDirection('OMER_TO_KAMIL')" id="btn-flow-otk" 
          class="py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 bg-brand-600 text-white shadow-md">
          <i class="fa-solid fa-user-gear"></i>
          <span data-i18n="btn_tab_request">Sahadan Talep</span>
        </button>
        <button onclick="setWorkflowDirection('KAMIL_TO_OMER')" id="btn-flow-kto" 
          class="py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 text-slate-400 hover:text-white">
          <i class="fa-solid fa-paper-plane"></i>
          <span data-i18n="btn_tab_dispatch">Sahaya İş Gönder</span>
        </button>
      </div>

      <!-- AKIŞ 1: SAHADAN TALEP (ÖMER ➔ KAMİL) -->
      <div id="form-omer-to-kamil" class="bg-cardbg border border-bordercol rounded-2xl p-4 shadow-xl space-y-3">
        <div class="border-b border-bordercol pb-2">
          <h2 class="text-sm font-bold text-white flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
            <span data-i18n="title_otk">Sahadan Talep (Ömer ➔ Kamil)</span>
          </h2>
          <p class="text-[11px] text-slate-400 mt-0.5" data-i18n="desc_otk">Talep doğrudan Kamil'e interaktif onay butonu olarak iletilir.</p>
        </div>

        <!-- Servis mi / Parça mı Seçeneği -->
        <div>
          <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_request_type">Talep Türü</label>
          <select id="otk-req-type" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500 font-medium">
            <option value="PARCA" data-i18n="opt_part_req">📦 Parça Talebi</option>
            <option value="SERVIS" data-i18n="opt_serv_req">🛠️ Servis Talebi</option>
            <option value="SERVIS_PARCA" data-i18n="opt_both_req">⚡ Servis + Parça Talebi</option>
          </select>
        </div>

        <div class="space-y-2">
          <div>
            <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_firm_name">Müşteri / Fabrika Adı</label>
            <input type="text" id="otk-firm-name" placeholder="Örn: Taşkent İplik Fabrikası" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_firm_contact">Yetkili Kişi & Telefon</label>
            <input type="text" id="otk-firm-contact" placeholder="Örn: Bekzod Usta (+998 90 123 45 67)" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <div>
          <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_select_part">İstenen Donanım / Ürün Kodu</label>
          <select id="otk-part" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none font-mono"></select>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_quantity">Miktar</label>
            <input type="number" id="otk-qty" value="1" min="1" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
          </div>
          <div>
            <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_priority">Durum</label>
            <select id="otk-priority" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
              <option value="NORMAL" data-i18n="prio_normal">Normal Servis</option>
              <option value="KRITIK" class="text-rose-400" data-i18n="prio_critical">Acil (Hat Duruşu!)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_note_otk">Ömer'in Notu</label>
          <textarea id="otk-notes" rows="2" placeholder="Örn: 2 no'lu panodaki CPU yandı, acil değişim gerekli..." class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white placeholder-slate-600"></textarea>
        </div>

        <button onclick="dispatchOmerToKamil()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold flex items-center justify-center space-x-2 text-sm shadow-lg shadow-emerald-900/30">
          <i class="fa-brands fa-telegram text-base"></i>
          <span data-i18n="btn_send_kamil">Kamil'e Gönder & Onay İste</span>
        </button>
      </div>

      <!-- AKIŞ 2: SAHAYA İŞ GÖNDER (KAMİL ➔ ÖMER) -->
      <div id="form-kamil-to-omer" class="bg-cardbg border border-bordercol rounded-2xl p-4 shadow-xl space-y-3 hidden">
        <div class="border-b border-bordercol pb-2">
          <h2 class="text-sm font-bold text-white flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
            <span data-i18n="title_kto">Sahaya İş Gönder (Kamil ➔ Ömer)</span>
          </h2>
          <p class="text-[11px] text-slate-400 mt-0.5" data-i18n="desc_kto">Kamil görevi serbestçe yazar, Ömer'in telefonuna anlık iş emri düşer.</p>
        </div>

        <div class="space-y-2">
          <div>
            <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_firm_name">Gidilecek Müşteri / Tesis Adı</label>
            <input type="text" id="kto-firm-name" placeholder="Örn: Samarkand Boyahane Fabrikası" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
          </div>
          <div>
            <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_firm_contact">Tesis Sorumlusu & Telefon</label>
            <input type="text" id="kto-firm-contact" placeholder="Örn: Farhod Bey (+998 93 450 11 22)" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
          </div>
        </div>

        <!-- Serbest Görev Tipi Girişi (Kamil İstediğini Yazar) -->
        <div>
          <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_task_free">Görev Tipi / Başlığı (Serbest Metin)</label>
          <input type="text" id="kto-task-type" placeholder="Örn: 2 no'lu boya kazanı inverter arızası, PLC revizyonu..." class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 font-medium">
        </div>

        <div>
          <label class="text-xs text-slate-400 font-semibold" data-i18n="lbl_instructions">Kamil'in Talimatı & İş Detayları</label>
          <textarea id="kto-instructions" rows="3" placeholder="Örn: Fabrikaya gidince ana panoyu kontrol et, sürücü parametrelerini yedekle..." class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white placeholder-slate-600"></textarea>
        </div>

        <button onclick="dispatchKamilToOmer()" class="w-full bg-cyan-600 hover:bg-cyan-500 py-3 rounded-xl font-bold flex items-center justify-center space-x-2 text-sm shadow-lg shadow-cyan-900/30">
          <i class="fa-solid fa-paper-plane text-base"></i>
          <span data-i18n="btn_send_omer">Sahaya İş Gönder (Ömer'e Fırlat)</span>
        </button>
      </div>

    </section>

  </main>

  <!-- ==================== MODAL: YENİ PARÇA EKLE ==================== -->
  <div id="modal-stock" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-cardbg border border-bordercol w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 space-y-3">
      <div class="flex justify-between items-center border-b border-bordercol pb-2">
        <h3 class="font-bold text-white text-sm" data-i18n="modal_add_title">Yeni Endüstriyel Parça Kaydı</h3>
        <button onclick="closeStockModal()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white rounded-lg bg-darkbg">✕</button>
      </div>
      
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs text-rose-400 font-bold">* Ürün Kodu (Zorunlu)</label>
          <input type="text" id="m-code" placeholder="Örn: EL-PLC-T390" class="w-full mt-1 bg-darkbg border border-rose-500/50 rounded-xl px-3 py-2 text-sm text-white font-mono focus:border-rose-500">
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium" data-i18n="lbl_category">Kategori</label>
          <select id="m-cat" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-2.5 py-2 text-sm text-white">
            <option value="KONTROL">Kontrolörler</option>
            <option value="ELEKTRONIK">Elektronik</option>
            <option value="MEKATRONIK">Mekatronik</option>
          </select>
        </div>
      </div>

      <div>
        <label class="text-xs text-slate-400 font-medium">Parça İsmi</label>
        <input type="text" id="m-name" placeholder="Örn: Eliar T800 Boya Kontrolörü" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
      </div>
      
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="text-xs text-slate-400 font-medium">Miktar</label>
          <input type="number" id="m-qty" value="1" min="0" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium">Fiyat</label>
          <input type="number" id="m-price" value="100" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium">Birim</label>
          <select id="m-curr" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-2 py-2 text-sm text-white">
            <option value="USD">USD</option>
            <option value="UZS">UZS</option>
            <option value="TRY">TRY</option>
          </select>
        </div>
      </div>

      <div>
        <label class="text-xs text-slate-400 font-medium">Araç İçi Raf / Konum</label>
        <input type="text" id="m-loc" placeholder="Örn: ÖMER-ARAÇ-RAF1" class="w-full mt-1 bg-darkbg border border-bordercol rounded-xl px-3 py-2 text-sm text-white">
      </div>

      <button onclick="saveStockItem()" class="w-full bg-brand-600 hover:bg-brand-500 py-2.5 rounded-xl font-bold text-white text-sm shadow-lg shadow-brand-900/30" data-i18n="btn_save_item">Stoka Kaydet & Bildir</button>
    </div>
  </div>

  <!-- ==================== UYGULAMA MOTORU ==================== -->
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
      tg.setHeaderColor('#161F30');
      tg.setBackgroundColor('#0B0F19');
    }

    const I18N = {
      tr: {
        nav_stock: "Stok Yönetimi", nav_workflow: "İş Paylaşımı",
        cat_all: "Tümü", cat_control: "Kontrolörler", cat_electronic: "Elektronik", cat_mechatronic: "Mekatronik",
        btn_tab_request: "Sahadan Talep", btn_tab_dispatch: "Sahaya İş Gönder",
        title_otk: "Sahadan Talep (Ömer ➔ Kamil)",
        desc_otk: "Talep doğrudan Kamil'e interaktif onay butonu olarak iletilir.",
        title_kto: "Sahaya İş Gönder (Kamil ➔ Ömer)",
        desc_kto: "Kamil görevi serbestçe yazar, Ömer'in telefonuna anlık iş emri düşer.",
        lbl_request_type: "Talep Türü",
        opt_part_req: "📦 Parça Talebi", opt_serv_req: "🛠️ Servis Talebi", opt_both_req: "⚡ Servis + Parça Talebi",
        lbl_firm_name: "Müşteri / Fabrika Adı",
        lbl_firm_contact: "Yetkili Kişi & Telefon",
        lbl_select_part: "İstenen Donanım / Ürün Kodu",
        lbl_quantity: "Miktar",
        lbl_priority: "Öncelik Seviyesi",
        prio_normal: "Normal Servis",
        prio_critical: "Acil (Hat Duruşu!)",
        lbl_note_otk: "Ömer'in Notu",
        btn_send_kamil: "Kamil'e Gönder & Onay İste",
        lbl_task_free: "Görev Tipi / Başlığı (Serbest Metin)",
        lbl_instructions: "Kamil'in Talimatı & İş Detayları",
        btn_send_omer: "Sahaya İş Gönder (Ömer'e Fırlat)",
        btn_add_part: "Yeni Parça",
        lbl_category: "Kategori",
        modal_add_title: "Yeni Endüstriyel Parça Kaydı",
        btn_save_item: "Stoka Kaydet & Bildir",
        shelf: "Konum", stock_status: "Mevcut:"
      },
      uz: {
        nav_stock: "Ombor Boshqaruvi", nav_workflow: "Ish Taqsimoti",
        cat_all: "Hammasi", cat_control: "Kontrollerlar", cat_electronic: "Elektronika", cat_mechatronic: "Mexatronika",
        btn_tab_request: "Maydondan So'rov", btn_tab_dispatch: "Maydonga Ish Yuborish",
        title_otk: "Maydondan So'rov (O'mar ➔ Komil)",
        desc_otk: "So'rov to'g'ridan-to'g'ri Komilga tasdiq tugmasi bilan yuboriladi.",
        title_kto: "Maydonga Ish Yuborish (Komil ➔ O'mar)",
        desc_kto: "Komil vazifani erkin yozadi, O'marning telefoniga ish buyrug'i tushadi.",
        lbl_request_type: "So'rov Turi",
        opt_part_req: "📦 Ehtiyot Qism So'rovi", opt_serv_req: "🛠️ Servis Xizmati So'rovi", opt_both_req: "⚡ Servis + Qism So'rovi",
        lbl_firm_name: "Mijoz / Fabrika Nomi",
        lbl_firm_contact: "Mas'ul Shaxs & Telefon",
        lbl_select_part: "Kerakli Qurilma / Mahsulot Kodi",
        lbl_quantity: "Miqdori",
        lbl_priority: "Muhimlik Darajasi",
        prio_normal: "Oddiy Servis",
        prio_critical: "Shoshilinch (Zavod To'xtadi!)",
        lbl_note_otk: "O'marning Izohi",
        btn_send_kamil: "Komilga Yuborish & Tasdiq Olish",
        lbl_task_free: "Vazifa Turi / Mavzusi (Erkin Matn)",
        lbl_instructions: "Komilning Ko'rsatmasi & Tafsilotlar",
        btn_send_omer: "Maydonga Ish Yuborish (O'marga)",
        btn_add_part: "Yangi Qism",
        lbl_category: "Toifa",
        modal_add_title: "Yangi Sanoat Qismi Kiritish",
        btn_save_item: "Omborga Saqlash & Xabar Qilish",
        shelf: "Joy", stock_status: "Mavjud:"
      }
    };

    let currentLang = localStorage.getItem('eliar_lang') || 'tr';
    let currentFlow = 'OMER_TO_KAMIL';
    let selectedCat = 'ALL';

    const DEFAULT_STOCKS = [
      { id: "1", code: "EL-PLC-T390", name: "Eliar T390 Boya Kontrolörü", cat: "KONTROL", qty: 6, price: 1250, curr: "USD", loc: "ÖMER-ARAÇ-RAF1" },
      { id: "2", code: "EL-MOD-16DI", name: "16 Kanal Dijital Giriş Modülü", cat: "ELEKTRONIK", qty: 18, price: 180, curr: "USD", loc: "ÖMER-ARAÇ-RAF2" },
      { id: "3", code: "EL-SEN-PT100", name: "PT100 Sıcaklık Sensörü 3m", cat: "ELEKTRONIK", qty: 25, price: 65, curr: "USD", loc: "ÖMER-ÇANTA" },
      { id: "4", code: "EL-VLV-DN25", name: "Oransal Buhar Vanası Motorlu DN25", cat: "MEKATRONIK", qty: 3, price: 5400000, curr: "UZS", loc: "MERKEZ-DEPO-B2" },
      { id: "5", code: "EL-INV-5KW", name: "5.5kW Asenkron Motor Sürücüsü", cat: "MEKATRONIK", qty: 4, price: 890, curr: "USD", loc: "MERKEZ-DEPO-A1" }
    ];

    let stocks = JSON.parse(localStorage.getItem('eliar_stocks')) || DEFAULT_STOCKS;

    function persist() {
      localStorage.setItem('eliar_stocks', JSON.stringify(stocks));
      populateSelects();
    }

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('eliar_lang', lang);
      document.getElementById('lang-tr').className = lang === 'tr' ? "px-2.5 py-1 text-xs font-bold rounded-lg bg-brand-600 text-white" : "px-2.5 py-1 text-xs font-bold rounded-lg text-slate-400";
      document.getElementById('lang-uz').className = lang === 'uz' ? "px-2.5 py-1 text-xs font-bold rounded-lg bg-brand-600 text-white" : "px-2.5 py-1 text-xs font-bold rounded-lg text-slate-400";
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (I18N[lang][k]) el.innerText = I18N[lang][k];
      });
      renderStockTable();
    }

    function switchTab(t) {
      document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden'));
      document.getElementById('tab-' + t).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('bg-brand-600', 'text-white'); b.classList.add('text-slate-400'); });
      document.getElementById('tab-btn-' + t).classList.add('bg-brand-600', 'text-white');
      if (t === 'workflow') populateSelects();
    }

    function setWorkflowDirection(dir) {
      currentFlow = dir;
      if (dir === 'OMER_TO_KAMIL') {
        document.getElementById('btn-flow-otk').className = "py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 bg-brand-600 text-white shadow-md";
        document.getElementById('btn-flow-kto').className = "py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 text-slate-400 hover:text-white";
        document.getElementById('form-omer-to-kamil').classList.remove('hidden');
        document.getElementById('form-kamil-to-omer').classList.add('hidden');
      } else {
        document.getElementById('btn-flow-kto').className = "py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 bg-cyan-600 text-white shadow-md";
        document.getElementById('btn-flow-otk').className = "py-2.5 px-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center space-x-1.5 text-slate-400 hover:text-white";
        document.getElementById('form-kamil-to-omer').classList.remove('hidden');
        document.getElementById('form-omer-to-kamil').classList.add('hidden');
      }
    }

    function filterCategory(cat) {
      selectedCat = cat;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        btn.classList.remove('bg-brand-600', 'text-white', 'shadow-sm');
        btn.classList.add('bg-cardbg', 'border', 'border-bordercol', 'text-slate-300');
      });
      const activeBtn = document.getElementById('pill-' + cat);
      if (activeBtn) {
        activeBtn.classList.remove('bg-cardbg', 'border', 'border-bordercol', 'text-slate-300');
        activeBtn.classList.add('bg-brand-600', 'text-white', 'shadow-sm');
      }
      renderStockTable();
    }

    function getCategoryBadge(cat) {
      if (cat === 'KONTROL') {
        return `<span class="text-[9px] font-bold px-2 py-0.5 rounded-md bg-emerald-950 text-emerald-400 border border-emerald-800 flex items-center space-x-1">
          <i class="fa-solid fa-microchip text-[8px] mr-1"></i>${I18N[currentLang].cat_control}
        </span>`;
      } else if (cat === 'ELEKTRONIK') {
        return `<span class="text-[9px] font-bold px-2 py-0.5 rounded-md bg-amber-950 text-amber-400 border border-amber-800 flex items-center space-x-1">
          <i class="fa-solid fa-bolt text-[8px] mr-1"></i>${I18N[currentLang].cat_electronic}
        </span>`;
      } else {
        return `<span class="text-[9px] font-bold px-2 py-0.5 rounded-md bg-purple-950 text-purple-400 border border-purple-800 flex items-center space-x-1">
          <i class="fa-solid fa-gears text-[8px] mr-1"></i>${I18N[currentLang].cat_mechatronic}
        </span>`;
      }
    }

    function renderStockTable() {
      const s = document.getElementById('stock-search')?.value.toLowerCase() || "";
      const filtered = stocks.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(s) || p.code.toLowerCase().includes(s);
        const matchesCat = (selectedCat === 'ALL') || (p.cat === selectedCat);
        return matchesSearch && matchesCat;
      });

      if (filtered.length === 0) {
        document.getElementById('stock-list').innerHTML = `<div class="p-6 text-center text-xs text-slate-500 bg-cardbg rounded-2xl border border-bordercol">Bu kategoride parça bulunamadı.</div>`;
        return;
      }

      document.getElementById('stock-list').innerHTML = filtered.map(i => `
        <div class="bg-cardbg border border-bordercol rounded-2xl p-3 flex justify-between items-center shadow-md hover:border-slate-600 transition">
          <div>
            <div class="flex items-center space-x-2">
              <span class="text-[10px] font-mono font-bold text-white bg-darkbg px-2 py-0.5 rounded border border-emerald-500/40 tracking-wider">${i.code}</span>
              ${getCategoryBadge(i.cat || 'KONTROL')}
            </div>
            <h4 class="text-sm font-semibold text-white mt-1 leading-tight">${i.name}</h4>
            <p class="text-xs text-slate-400 mt-0.5">${I18N[currentLang].shelf}: ${i.loc} • <span class="text-amber-400 font-bold">${i.price.toLocaleString()} ${i.curr}</span></p>
          </div>
          <div class="flex items-center space-x-2">
            <span class="text-sm font-black text-emerald-400 whitespace-nowrap">${i.qty} ADT</span>
            <div class="flex flex-col space-y-1">
              <button onclick="changeStock('${i.id}', 1)" title="1 Adet Ekle ve Bildir" class="w-7 h-7 bg-darkbg border border-bordercol hover:bg-emerald-950 text-emerald-400 rounded-lg text-xs font-bold flex items-center justify-center active:scale-95">+</button>
              <button onclick="changeStock('${i.id}', -1)" title="1 Adet Düş ve Nereye Satıldığını Sor" class="w-7 h-7 bg-darkbg border border-bordercol hover:bg-rose-950 text-rose-400 rounded-lg text-xs font-bold flex items-center justify-center active:scale-95">-</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    /* ==================== STOKTAN ÇIKARILIRKEN NEREYE SATILDIĞINI SORAN MOTOR ==================== */
    function changeStock(id, delta) {
      const it = stocks.find(x => x.id === id);
      if (!it) return;
      if (it.qty + delta < 0) {
        alert("Stok adedi 0'ın altına düşemez!");
        return;
      }

      let destination = "";

      // Parça çıkarılıyorsa nereye satıldığını ZORUNLU olarak sor
      if (delta < 0) {
        destination = prompt(`[${it.code}] ${it.name} stoktan düşülüyor.\n\nBu parça NEREYE SATILDI / Hangi tesise kullanıldı? (Zorunlu):`);
        
        if (!destination || destination.trim() === "") {
          alert("⚠️ Satılan müşteri/tesis adı belirtilmeden stoktan parça düşülemez!");
          return;
        }
      } else {
        const confirmMsg = `[${it.code}] için stok +1 artırılsın mı?`;
        if (!confirm(confirmMsg)) return;
      }

      it.qty += delta;
      persist();
      renderStockTable();

      const payload = {
        direction: "STOCK_CHANGE",
        action: delta < 0 ? "DECREASE" : "INCREASE",
        delta: Math.abs(delta),
        category: it.cat || "KONTROL",
        code: it.code,
        name: it.name,
        current_qty: it.qty,
        destination: destination.trim(),
        loc: it.loc
      };

      if (tg?.sendData) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert(`[Test Modu] ${it.code} stok güncellendi: ${it.qty} Adet. Hedef Tesis: ${destination || 'Yok'}`);
      }
    }

    function populateSelects() {
      const partOptions = stocks.map(p => `<option value="${p.code}">[${p.code}] ${p.name} (Stok: ${p.qty})</option>`).join('');
      document.getElementById('otk-part').innerHTML = partOptions;
    }

    function openStockModal() { document.getElementById('modal-stock').classList.remove('hidden'); document.getElementById('modal-stock').classList.add('flex'); }
    function closeStockModal() { document.getElementById('modal-stock').classList.add('hidden'); document.getElementById('modal-stock').classList.remove('flex'); }

    /* ==================== KODSUZ ÜRÜN EKLETİLMEYEN KAYIT FONKSİYONU ==================== */
    function saveStockItem() {
      const code = document.getElementById('m-code').value.trim();
      const cat = document.getElementById('m-cat').value;
      const name = document.getElementById('m-name').value.trim();
      const qty = parseInt(document.getElementById('m-qty').value) || 0;
      const price = parseFloat(document.getElementById('m-price').value) || 0;
      const curr = document.getElementById('m-curr').value;
      const loc = document.getElementById('m-loc').value.trim() || 'ÖMER-ARAÇ';
      
      // KESİN KURAL: Ürün kodsuz ürün olamaz!
      if (!code) {
        alert("⛔ HATA: Ürün kodu zorunludur! Ürün kodsuz parça sisteme kaydedilemez.");
        document.getElementById('m-code').focus();
        return;
      }

      if (!name) {
        alert("Parça ismi boş bırakılamaz!");
        return;
      }

      // Aynı koddan parça var mı kontrolü
      const existing = stocks.find(p => p.code.toLowerCase() === code.toLowerCase());
      if (existing) {
        alert(`⛔ HATA: '${code}' ürün koduna sahip başka bir ürün zaten mevcut!`);
        return;
      }
      
      stocks.unshift({ id: Date.now().toString(), code, cat, name, qty, price, curr, loc });
      persist();
      closeStockModal();
      renderStockTable();

      const payload = {
        direction: "STOCK_CHANGE",
        action: "NEW_ITEM",
        category: cat,
        code: code,
        name: name,
        qty: qty,
        price: price,
        curr: curr,
        loc: loc
      };

      if (tg?.sendData) tg.sendData(JSON.stringify(payload));
      
      // Formu temizle
      document.getElementById('m-code').value = "";
      document.getElementById('m-name').value = "";
    }

    /* SAHADAN TALEP (ÖMER ➔ KAMİL) */
    function dispatchOmerToKamil() {
      const firmName = document.getElementById('otk-firm-name').value.trim();
      const firmContact = document.getElementById('otk-firm-contact').value.trim();
      const reqType = document.getElementById('otk-req-type').value;

      if (!firmName) {
        alert("Lütfen Müşteri / Fabrika Adını yazın!");
        return;
      }

      const partCode = document.getElementById('otk-part').value;
      const partObj = stocks.find(p => p.code === partCode);

      const payload = {
        direction: "OMER_TO_KAMIL",
        request_type: reqType,
        firm: firmName,
        contact: firmContact || "Belirtilmedi",
        category: partObj?.cat || "GENEL",
        part_code: partCode,
        part_name: partObj?.name || "",
        quantity: document.getElementById('otk-qty').value,
        priority: document.getElementById('otk-priority').value,
        notes: document.getElementById('otk-notes').value
      };

      if (tg?.sendData) tg.sendData(JSON.stringify(payload));
    }

    /* SAHAYA İŞ GÖNDER (KAMİL ➔ ÖMER) */
    function dispatchKamilToOmer() {
      const firmName = document.getElementById('kto-firm-name').value.trim();
      const firmContact = document.getElementById('kto-firm-contact').value.trim();
      const taskType = document.getElementById('kto-task-type').value.trim();

      if (!firmName) {
        alert("Lütfen Gidilecek Müşteri / Tesis Adını yazın!");
        return;
      }

      if (!taskType) {
        alert("Lütfen yapılacak Görev Tipini serbestçe yazın!");
        return;
      }

      const payload = {
        direction: "KAMIL_TO_OMER",
        firm: firmName,
        contact: firmContact || "Belirtilmedi",
        task_type: taskType,
        instructions: document.getElementById('kto-instructions').value
      };

      if (tg?.sendData) tg.sendData(JSON.stringify(payload));
    }

    window.addEventListener('DOMContentLoaded', () => {
      setLanguage(currentLang);
      switchTab('stock');
      filterCategory('ALL');
      populateSelects();
    });
  </script>
</body>
</html>
